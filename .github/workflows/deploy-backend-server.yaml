name: Deploy backend server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'The environment to deploy to'
        default: "test"
        type: environment
        required: true
  workflow_call:

jobs:
  deploy-docker-stack:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.environment || 'test' }}
    steps:
      - uses: actions/checkout@v7
      - name: Make envfile
        uses: SpicyPizza/create-envfile@v2.0
        with:
          file_name: .env
          envkey_DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'test' }}
          envkey_LPDB_CONNECTION_STRING: ${{ secrets.API_SERVER_DB_CONNECTION_STRING }}
          envkey_USE_SWAGGERUI: true
          envkey_AWS_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          envkey_AWS_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          envkey_AWS_COGNITO_REGION: ${{ vars.FRONTEND_PRIMARY_REGION }}
          envkey_AWS_CONFIG_FILE: "/app/.aws_config"
          envkey_AWS_PROFILE: ${{ vars.AWS_PROFILE }}
          envkey_CONCERT_IMAGE_BUCKET_NAME: ${{ vars.CONCERT_IMAGE_BUCKET_NAME }}
          envkey_TRAEFIK_ROUTER_API_SERVER: ${{ vars.TRAEFIK_ROUTER_API_SERVER }}
          envkey_API_IMAGE: "ghcr.io/felixsfd/lpshows-api-server:${{ vars.SERVER_IMAGE_TAG }}"
          envkey_API_HOSTNAME: "api.${{ vars.ROOT_DOMAIN }}"
      - name: Deploy .env file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          key: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
          port: ${{ secrets.BACKEND_SSH_PORT }}
          source: ".env,compose.yaml,compose.deployment.yaml"
          target: ${{ secrets.BACKEND_SERVER_STACK_PATH }}
      - name: Deploy SharePic templates
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete-after
          path: Service.SharePics/Templates/
          remote_path: ${{ secrets.BACKEND_SERVER_STACK_PATH }}/templates # ex: /var/www/html/
          remote_host: ${{ vars.BACKEND_SSH_HOST }} # ex: example.com
          remote_port: ${{ secrets.BACKEND_SSH_PORT }} # ex: 22
          remote_user: ${{ secrets.BACKEND_SSH_USERNAME }} # ex: ubuntu
          remote_key: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: ${{ secrets.BACKEND_SSH_PORT }}
          script: |
            cd ${{ secrets.BACKEND_SERVER_STACK_PATH }}
            docker compose -f compose.yaml -f compose.deployment.yaml pull
            docker compose -f compose.yaml -f compose.deployment.yaml up -d
