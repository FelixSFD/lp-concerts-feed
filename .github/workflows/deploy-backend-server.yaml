name: Deploy backend server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'The environment to deploy to'
        default: "test"
        type: environment
        required: true
  workflow_call:

jobs:
  deploy-docker-stack:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ inputs.environment || 'test' }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy SharePic templates
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete-after
          path: Service.SharePics/Templates/
          remote_path: ${{ secrets.BACKEND_SERVER_STACK_PATH }}/templates # ex: /var/www/html/
          remote_host: ${{ vars.BACKEND_SSH_HOST }} # ex: example.com
          remote_port: ${{ secrets.BACKEND_SSH_PORT }} # ex: 22
          remote_user: ${{ secrets.BACKEND_SSH_USERNAME }} # ex: ubuntu
          remote_key: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USERNAME }}
          password: ${{ secrets.BACKEND_SSH_PASSWORD }}
          port: ${{ secrets.BACKEND_SSH_PORT }}
          script: |
            cd ${{ secrets.BACKEND_SERVER_STACK_PATH }}
            docker compose pull
            docker compose up -d
