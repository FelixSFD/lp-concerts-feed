name: Run tests

on:
  push:
    branches: [ "**" ]

jobs:
  build_backend:
    runs-on: ubuntu-latest
    outputs:
      test_namespaces: ${{ steps.test-matrix.outputs.namespaces }}
    steps:
      - name: Define backend test matrix
        id: test-matrix
        run: |
          echo 'namespaces=["Database.Setlists","Database.Tours","remaining"]' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Generate models from OpenAPI
        working-directory: ./Common.Contracts
        run: ./generate-dotnet-api.sh
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: |
            **/bin/**
            **/obj/**
          include-hidden-files: true
          retention-days: 1
  
  test_backend:
    needs: build_backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        namespace: ${{ fromJSON(needs.build_backend.outputs.test_namespaces) }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: backend-build
      - name: restore
        run: dotnet restore
      - name: Print all files in Database.Setlists
        run: ls -R Database.Setlists.Tests
      - name: Test
        env:
          TEST_NAMESPACE: ${{ matrix.namespace }}
          TEST_NAMESPACES: ${{ needs.build_backend.outputs.test_namespaces }}
        run: |
          if [[ "$TEST_NAMESPACE" == "remaining" ]]; then
            filter=$(jq -r 'map(select(. != "remaining") | "FullyQualifiedName!~" + .) | join("&")' <<< "$TEST_NAMESPACES")
          else
            filter="FullyQualifiedName~$TEST_NAMESPACE"
          fi

          filter_args=()
          if [[ -n "$filter" ]]; then
            filter_args=(--filter "$filter")
          fi

          dotnet test \
            --no-build \
            --logger "trx" \
            --results-directory "TestResults" \
            --settings:"Lambda.GetS3UploadUrl/test/Lambda.GetS3UploadUrl.Tests/test.runsettings" \
            "${filter_args[@]}"
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-results-${{ matrix.namespace }}
          path: TestResults
          retention-days: 1
          
  publish_test_results:
    needs: test_backend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: TestResults
          merge-multiple: true
      - name: Generate test report
        uses: bibipkins/dotnet-test-reporter@v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-title: 'Unit Test Results'
          results-path: './TestResults/**/*.trx'
