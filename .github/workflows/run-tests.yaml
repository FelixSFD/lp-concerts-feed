name: Run tests

on:
  push:
    branches: [ "**" ]

jobs:
  build_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Generate models from OpenAPI
        working-directory: ./Common.Contracts
        run: ./generate-dotnet-api.sh
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: |
            **/bin/**
            **/obj/**
          include-hidden-files: true
          retention-days: 1
  
  test_backend:
    needs: build_backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_filter:
          - 'FullyQualifiedName~Database.Setlists'
          - 'FullyQualifiedName~Database.Tours'
          - 'FullyQualifiedName!~Database.'
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: backend-build
      - name: restore
        run: dotnet restore
      - name: Print all files in Database.Setlists
        run: ls -R Database.Setlists.Tests
      - name: Test
        run: |
          dotnet test \
            --no-build \
            --logger trx \
            --results-directory "TestResults" \
            --settings:"Lambda.GetS3UploadUrl/test/Lambda.GetS3UploadUrl.Tests/test.runsettings" \
            --filter "${{ matrix.test_filter }}"
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-results-${{ matrix.test_filter }}
          path: TestResults
          retention-days: 1
          
  publish_test_results:
    needs: test_backend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          path: TestResults
          merge-multiple: true
      - name: Generate test report
        uses: bibipkins/dotnet-test-reporter@v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-title: 'Unit Test Results'
          results-path: './TestResults/**/*.trx'