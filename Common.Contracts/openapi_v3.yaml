openapi: 3.0.4
info:
  title: LPshows.live API v3
  description: This is the API for the Linkin Park Concert Calendar fan project
  version: 3.0.0
servers:
  - url: /
  - url: http://localhost:5133
paths:
  /v3/apple-music/token:
    get:
      operationId: GetAppleMusicDeveloperToken
      summary: Returns a developer token to access the Apple Music API
      tags:
        - AppleMusic
      responses:
        "200":
          description: The token as plain text
          content:
            text/plain:
              schema:
                type: string
  /v3/Concerts:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    post:
      tags:
        - Concerts
      summary: Creates a new concert in the database
      operationId: CreateConcert
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConcertRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateConcertRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateConcertRequest"
        required: true
      responses:
        "200":
          description: the created concert
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: POST
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts
      security:
        - Bearer: []
    get:
      tags:
        - Concerts
      summary: Returns a list of concerts that can be filtered
      operationId: GetConcerts
      parameters:
        - $ref: "#/components/parameters/CountryCode"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/City"
        - $ref: "#/components/parameters/Venue"
        - $ref: "#/components/parameters/CustomConcertTitle"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/TourId"
        - $ref: "#/components/parameters/TourLegId"
        - name: Limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: number
            format: uint32
        - name: Skip
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: number
            format: uint32
        - name: OrderBy
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: List of concerts including referenced objects
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertListResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertListResponse"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts
  
  /v3/Concerts/import:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      operationId: GetConcertImportStatus
      tags:
        - Concerts
      responses:
        200:
          description: A JSON object with all concerts from Linkinpedia and their import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkinpediaImportStatus"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - Bearer: [ ]
  
  /v3/Concerts/import/{wikiPageId}:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      operationId: GetConcertImportPlan
      tags:
        - Concerts
      parameters:
        - name: wikiPageId
          in: path
          required: true
          schema: 
            type: string
      responses: 
        200:
          description: A JSON object with the information of the concert import plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportConcertPreview"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: [ ]
  /v3/Concerts/upcoming:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      tags:
        - Concerts
      summary: Returns the next x concerts from the current time
      operationId: GetUpcomingConcerts
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: "List of upcoming concerts"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
  /v3/Concerts/upcoming/attending:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      tags:
        - Concerts
      summary: Returns the next x concerts from the current time that the user is planning to attend
      operationId: GetUpcomingAttendingConcerts
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: "List of upcoming concerts"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
      security:
        - Bearer: [ ]
  /v3/Concerts/upcoming/bookmarked:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      tags:
        - Concerts
      summary: Returns the next x concerts from the current time that the user has bookmarked
      operationId: GetUpcomingBookmarkedConcerts
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: "List of upcoming concerts"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
      security:
        - Bearer: [ ]
  /v3/Concerts/recent:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      tags:
        - Concerts
      summary: Returns the latest x concerts from the current time
      operationId: GetRecentConcerts
      parameters:
        - $ref: "#/components/parameters/PaginationLimit"
      responses:
        "200":
          description: "List of previous concerts"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
  /v3/Concerts/next:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      tags:
        - Concerts
      summary: Returns the next concert from the current time
      operationId: GetNextConcert
      deprecated: true
      description: Returns the next concert from the current time. This endpoint is deprecated and will be removed in a future release. Please use the /v3/Concerts/upcoming endpoint instead.
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
        "404":
          description: "Not Found: There is no upcoming concert scheduled"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v3/Concerts/otd:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      tags:
        - Concerts
      summary: Returns the concerts that happened on a specific day and month
      operationId: GetConcertsOnThisDay
      parameters:
        - name: month
          in: query
          schema:
            type: integer
        - name: day
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: "List of previous concerts"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
  /v3/Concerts/{concertId}:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    put:
      tags:
        - Concerts
      summary: Updates a concert in the database
      operationId: UpdateConcert
      parameters:
        - name: concertId
          in: path
          description: ID of the concert to update
          required: true
          schema:
            type: string
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateConcertRequest"
        required: true
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: PUT
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
      security:
        - Bearer: []
    get:
      tags:
        - Concerts
      summary: Returns a concert without loading the referenced objects like the venue
        details
      operationId: GetRawConcertById
      parameters:
        - name: concertId
          in: path
          description: ""
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/RawConcert"
            application/json:
              schema:
                $ref: "#/components/schemas/RawConcert"
            text/json:
              schema:
                $ref: "#/components/schemas/RawConcert"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
      security:
        - Bearer: []
    delete:
      tags:
        - Concerts
      summary: Deletes a concert. Note that the data will not be fully removed from
        the database. Admins will still be able to see deleted concerts.
      operationId: DeleteConcertById
      parameters:
        - name: concertId
          in: path
          description: ID of the concert to delete
          required: true
          schema:
            type: string
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: DELETE
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
      security:
        - Bearer: []
  /v3/Concerts/{concertId}/details:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      tags:
        - Concerts
      summary: Returns all details about a concert. This includes information about
        the venue and general location.
      operationId: GetConcertById
      parameters:
        - name: concertId
          in: path
          description: ""
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}/details
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
  /v3/Concerts/{concertId}/schedule:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    put:
      operationId: GetUrlForConcertFileUpload
      summary: Requests a URL that can be used to upload the image of the schedule of a concert
      tags:
        - Concerts
      parameters:
        - name: concertId
          in: path
          description: "ID of the concert to upload the schedule image for"
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConcertScheduleUploadRequest"
      responses:
        "200":
          description: URL for upload requested successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertFileUploadResponse"
      security:
        - ConcertsCognitoAuthorizer: [ "openid" ]
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn:
                Fn::ImportValue:
                  Fn::Sub: "${BaseProductName}-lambda-concert-s3-upload-url-function"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  /v3/Concerts/{concertId}/adjacent:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      operationId: GetAdjacentConcertsForId
      summary: Returns information about the previous and next concerts
      tags:
        - Concerts
      parameters:
        - in: path
          name: concertId
          description: ID of the concert
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A JSON object with the information of the adjacent concerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjacentConcertsResponse"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}/adjacent
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
  /v3/Concerts/{concertId}/bookmarks:
    put:
      operationId: SetBookmarkOnConcert
      summary: Sets the bookmark of the current user to the concert
      tags:
        - Concerts
      parameters:
        - in: path
          name: concertId
          description: ID of the concert
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConcertBookmarkUpdateRequest"
      responses:
        "204":
          description: Bookmark updated successfully
      security:
        - Bearer: [ ]
    get:
      operationId: GetBookmarkCountForConcert
      summary: Checks how many bookmarks there are for a concert. Use GetBookmarkStatusForConcert if you want to check the status for the current user
      tags:
        - Concerts
      parameters:
        - in: path
          name: concertId
          description: ID of the concert
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Found the number of bookmarks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConcertBookmarkCountsResponse"
      security:
        - Bearer: [ ]

  /v3/Concerts/{concertId}/setlists:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
      - name: concertId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Concerts
        - Setlists
      summary: Returns all setlists for a concert
      operationId: GetSetlistsForConcert
      responses:
        "200":
          description: List of setlists for the concert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setlist"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}/setlists
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId

  /v3/Concerts/{concertId}/setlists/import:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
      - name: concertId
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Concerts
        - Setlists
      summary: Imports a setlist from Linkinpedia for a concert
      operationId: ImportSetlistFromLinkinpedia
      security:
        - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSetlistRequest"
        required: true
      responses:
        "200":
          description: Import preview instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSetlistPreview"
        "400":
          description: "Bad Request"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: POST
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}/setlists/import
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
  
  /v2/concerts/{id}/bookmarks/count:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      operationId: GetBookmarkCountForConcertOld
      summary: Checks how many bookmarks there are for a concert. Use GetBookmarkStatusForConcert if you want to check the status for the current user
      tags:
        - concerts
      parameters:
        - in: path
          name: id
          description: ID of the concert
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Found the number of bookmarks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConcertBookmarkCountsResponse"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn:
                Fn::ImportValue:
                  Fn::Sub: "${BaseProductName}-lambda-concert-bookmarks-read-function"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  
  /v3/ConcertTypes:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    post:
      tags:
        - ConcertTypes
      summary: Creates a new type of concert
      operationId: CreateConcertType
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConcertTypeRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateConcertTypeRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateConcertTypeRequest"
        required: true
      responses:
        "200":
          description: ""
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: POST
        uri: https://api.dev.lpshows.felixsfd.de/v3/ConcertTypes
      security:
        - Bearer: []
    get:
      tags:
        - ConcertTypes
      summary: Returns all available concert types
      operationId: GetConcertTypes
      responses:
        "200":
          description: information about the concert types
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertType"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/ConcertTypes
      security:
        - Bearer: []
  
  /v3/ConcertTypes/{concertTypeId}:
    parameters:
      - $ref: "#/components/parameters/X-LP-Request-Id"
    get:
      tags:
        - ConcertTypes
      summary: Returns information about a concert type
      operationId: GetTypeById
      parameters:
        - name: concertTypeId
          in: path
          description: ID of the concert type
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
      responses:
        "200":
          description: information about the concert type
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertType"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/ConcertTypes/{concertTypeId}
        requestParameters:
          integration.request.path.concertId: method.request.path.concertTypeId
    put:
      tags:
        - ConcertTypes
      summary: Updates information of a concert type
      operationId: UpdateType
      parameters:
        - name: concertTypeId
          in: path
          description: ID of the concert type
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertTypeRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertTypeRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateConcertTypeRequest"
        required: true
      responses:
        "200":
          description: updated information about the concert type
          content:
            text/plain:
              schema:
