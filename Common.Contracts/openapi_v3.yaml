      operationId: DeleteCity
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country where the city is located in
          required: true
          schema:
            type: string
        - name: cityId
          in: path
          required: true
          schema:
            type: string
      responses:
