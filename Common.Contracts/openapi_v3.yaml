          format: int64
          minimum: 0
          maximum: 4294967295
        actNumber:
          type: number
          description: Number of the act. Can be used to reference an existing act or create a new one
        title:
          type: string
          description: Optional title of the act. Only required if the act is created.
          nullable: true

    SongParameters:
      type: object
      description: Parameters to define a song for an entry
      properties:
        id:
          type: number
          description: ID of the song
        title:
          type: string
          description: Title of the song. Only required if the song does not exist yet.
        albumId:
          type: number
          description: ID of the album containing this song. Only used when creating the song
          nullable: true
        isrc:
          type: string
          description: ISRC of the song
          nullable: true
        appleMusicId:
          type: string
          description: Unique ID for the Song on Apple Music
          nullable: true
        linkinpediaUrl:
          type: string
          description: URL to the wiki page on Linkinpedia
          nullable: true

    SetlistEntryParameters:
      type: object
      description: Parameters to define an entry
      properties:
        sortNumber:
          type: number
          description: Number to sort the entries
        songNumber:
          type: number
          description: Number of the song in this setlist. Is displayed as an orientation
        titleOverride:
          type: string
          description: Optional property to override the title of the song or mashup in this entry only.
          nullable: true
          maxLength: 31
        extraNotes:
          type: string
          description: Field to store additional notes about this entry
          nullable: true
          maxLength: 255
        isRotationSong:
          type: boolean
          description: true if this slot is known to rotate between shows on the same tour.
        isPlayedFromRecording:
          type: boolean
          description: true if the song was played from a recording only. Not played live. (this can happen for pre-show-songs for example)
        isWorldPremiere:
          type: boolean
          description: true if this song has not only not been played before, but was not released before this show. For example "Heavy Is The Crown" in Hamburg 2024
        isLivePremiere:
          type: boolean
          description: true if this song was already released, but played live for the first time. For example "Keys To The Kingdom" in Los Angeles 2024
    
    AddSongVariantToSetlistRequest:
      type: object
      description: Request to add a song variant to an existing setlist
      properties:
        songVariantParameters:
          type: object
          description: Parameters of the song variant for this entry
          oneOf:
            - $ref: "#/components/schemas/SongVariantParameters"
        actParameters:
          type: object
          description: If set, the added song will be added to this Act. Title isn't required if the Act already exists.
          nullable: true
          anyOf:
            - $ref: "#/components/schemas/ActParameters"
        entryParameters:
          type: object
          description: Common parameters for that entry, no matter if it was a song or mashup
          oneOf:
            - $ref: "#/components/schemas/SetlistEntryParameters"
    
    AddSongVariantToSetlistResponse:
      type: object
      description: Response after a song variant was added to the setlist
      properties:
        addedSetlistEntry:
          type: object
          description: The new entry that was added to the setlist
          oneOf:
            - $ref: "#/components/schemas/SetlistEntry"
    
    AddSongMashupToSetlistRequest:
      type: object
      description: Request to add a song mashup to an existing setlist
      required: 
        - songMashupParameters
        - entryParameters
      properties:
        songMashupParameters:
          type: object
          description: Parameters of the song mashup for this entry
          oneOf:
            - $ref: "#/components/schemas/SongMashupParameters"
        actParameters:
          type: object
          description: If set, the added song will be added to this Act. Title isn't required if the Act already exists.
          oneOf:
            - $ref: "#/components/schemas/ActParameters"
        entryParameters:
          type: object
          description: Common parameters for that entry, no matter if it was a song or mashup
          oneOf:
            - $ref: "#/components/schemas/SetlistEntryParameters"

    AddSongMashupToSetlistResponse:
      type: object
      description: Response after a song mashup was added to the setlist
      properties:
        addedSetlistEntry:
          type: object
          description: The new entry that was added to the setlist
          oneOf:
            - $ref: "#/components/schemas/SetlistEntry"
    
    AddSongToSetlistRequest:
      type: object
      description: Request to add a song to an existing setlist
      properties:
        songParameters:
          type: object
          description: Parameters of the song for this entry
          oneOf:
            - $ref: "#/components/schemas/SongParameters"
        actParameters:
          type: object
          description: If set, the added song will be added to this Act. Title isn't required if the Act already exists.
          oneOf:
            - $ref: "#/components/schemas/ActParameters"
        entryParameters:
          type: object
          description: Common parameters for that entry, no matter if it was a song or mashup
          oneOf:
            - $ref: "#/components/schemas/SetlistEntryParameters"
    
    AddSongToSetlistResponse:
      type: object
      description: Response after a song was added to the setlist
      properties:
        addedSetlistEntry:
          type: object
          description: The new entry that was added to the setlist
          oneOf:
            - $ref: "#/components/schemas/SetlistEntry"
    
    AddCustomEntryToSetlistRequest:
      type: object
      description: Request to add a custom entry to an existing setlist
      properties:
        actParameters:
          type: object
          description: If set, the added song will be added to this Act. Title isn't required if the Act already exists.
          nullable: true
          anyOf:
            - $ref: "#/components/schemas/ActParameters"
        entryParameters:
          type: object
          description: Common parameters for that entry, no matter if it was a song or mashup
          oneOf:
            - $ref: "#/components/schemas/SetlistEntryParameters"

    AddCustomEntryToSetlistResponse:
      type: object
      description: Response after a entry was added to the setlist
      properties:
        addedSetlistEntry:
          type: object
          description: The new entry that was added to the setlist
          oneOf:
            - $ref: "#/components/schemas/SetlistEntry"
    
    UpdateSetlistEntryRequest:
      type: object
      description: Request to update a single setlist entry
      required: 
        - entryParameters
      properties:
        songParameters:
          type: object
          description: Parameters of the song for this entry
          oneOf:
            - $ref: "#/components/schemas/SongParameters"
        songVariantParameters:
          type: object
          description: Parameters of the song variant for this entry
          oneOf:
            - $ref: "#/components/schemas/SongVariantParameters"
        songMashupParameters:
          type: object
          description: Parameters of the song mashup for this entry
          oneOf:
            - $ref: "#/components/schemas/SongMashupParameters"
        actParameters:
          type: object
          description: If set, the added song will be added to this Act. Title isn't required if the Act already exists.
          anyOf:
            - $ref: "#/components/schemas/ActParameters"
        entryParameters:
          type: object
          description: Common parameters for that entry, no matter if it was a song or mashup
          oneOf:
            - $ref: "#/components/schemas/SetlistEntryParameters"
    
    ReorderSetlistEntriesRequest:
      type: object
      description: Request to update the order of entries in a setlist. It's important that ALL entries are used here!
      properties:
        entryIds:
          type: array
          description: The IDs of all entries in that setlist in the preferred order
          items:
            type: string
            
    ReorderSetlistEntriesResponse:
      type: object
      description: Response after a setlist was reordered
      properties:
        reorderedEntries:
          type: array
          description: The newly ordered entries
          items:
            $ref: "#/components/schemas/SetlistEntry"
    
    ImportSetlistRequest:
      type: object
      description: Request to import a setlist
      properties:
        concertId:
          type: string
          description: ID of the concert where this setlist will be added
        linkinpediaUrl:
          type: string
          description: Link to the concert page on Linkinpedia. This page must contain the setlist
          
    ImportSetlistEntryPreview:
      type: object
      description: Contains data of a setlist entry. Some entries might have IDs for existing songs/mashups, some only a title.
      properties:
        title:
          type: string
          description: Title of this entry
        extraNotes:
          type: string
          description: Additional notes for this entry
          nullable: true
        songNumber:
          type: number
          description: Number of this entry within the setlist
        actNumber:
          type: number
          description: Number of this act within the setlist
          nullable: true
        foundSongId:
          type: number
          description: If an existing song was found, the ID will be in this property. If not, you either have to select an existing song or create it.
          nullable: true
        possibleSongVariants:
          type: array
          description: If a songId was found and the song has variants, all possible variants are listed here
          items:
            $ref: "#/components/schemas/SongVariant"
        foundSongIds:
          type: array
          description: If more than 1 matching song was found, the possible IDs are listed here
          items:
            type: number
        foundSongVariantId:
          type: number
          description: If an existing song variant was found, the ID will be in this property. If not, you either have to select an existing song variant or create it.
          nullable: true
        foundMashupId:
          type: number
          description: If an existing mashup was found, the ID will be in this property. If not, you either have to select an existing mashup or create it.
          nullable: true
    
    ImportSetlistActPreview:
      type: object
      description: Contains data of a setlist entry. Some entries might have IDs for existing songs/mashups, some only a title.
      properties:
        name:
          type: string
          description: Name of this act
        extraNotes:
          type: string
          description: Additional notes for this entry
          nullable: true
        actNumber:
          type: number
          description: Number of this act within the setlist
    
    ImportSetlistPreview:
      type: object
      description: Contains data of a setlist that could be created
      properties:
        concertId:
          type: string
          description: ID of the concert where this setlist will be added
        acts:
          type: array
          description: The acts that could be added to the new setlist
          items:
            $ref: "#/components/schemas/ImportSetlistActPreview"
        entries:
          type: array
          description: The entries that could be added to the new setlist
          items:
            $ref: "#/components/schemas/ImportSetlistEntryPreview"
  
  securitySchemes:
    Bearer:
      type: http
      description: JWT Bearer authentication
      scheme: Bearer
    ConcertsCognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - Fn::ImportValue:
              Fn::Sub: '${BaseProductName}-cognito-authorizer-user-pool'

