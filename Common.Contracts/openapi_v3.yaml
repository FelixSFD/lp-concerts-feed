      required: 
        - concerts
        - importedWithSetlistCount
        - importedWithoutSetlistCount
        - notImportedCount
      properties: 
        importedWithSetlistCount:
          type: integer
          description: Number of concerts that were imported with setlists
        importedWithoutSetlistCount:
          type: integer
          description: Number of concerts that were imported without setlists
        notImportedCount:
          type: integer
          description: Number of concerts that were not imported yet
        concerts:
          type: array
          description: Concerts that were found on Linkinpedia and their import status
