          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateCountryRequest"
        required: true
      responses:
        "200":
          description: ""
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
    get:
      tags:
        - Countries
      summary: Returns a list of all countries
      operationId: GetCountries
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Country"
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
            text/json:
              schema:
                $ref: "#/components/schemas/Country"
  /countries/{countryCode}:
    put:
      tags:
        - Countries
      summary: Updates an existing country
      operationId: UpdateCountry
      parameters:
        - name: countryCode
          in: path
          description: ISO-code of the country
          required: true
          schema:
            type: string
      requestBody:
        description: new data of the country
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCountryRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateCountryRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateCountryRequest"
        required: true
      responses:
        "200":
          description: the updated data
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Country"
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
            text/json:
              schema:
                $ref: "#/components/schemas/Country"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
    get:
      tags:
        - Countries
      summary: Returns a country by its ISO code
      operationId: GetCountryByIsoCode
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Country"
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
            text/json:
              schema:
                $ref: "#/components/schemas/Country"
    delete:
      tags:
        - Countries
      summary: Deletes a country
      operationId: DeleteCountryByIsoCode
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
  /countries/{countryCode}/states:
    post:
      tags:
        - Countries
      summary: Creates a new state in a country
      operationId: CreateState
      parameters:
        - name: countryCode
          in: path
          description: ISO code of the country where this state is located in
          required: true
          schema:
            type: string
      requestBody:
        description: Data of the new country
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStateRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateStateRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateStateRequest"
        required: true
      responses:
        "200":
          description: ""
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
