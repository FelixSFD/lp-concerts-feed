          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            application/json:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            text/json:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
  /countries/{countryCode}/states/{stateCode}:
    put:
      tags:
        - Countries
      summary: Updates a state in a country
      operationId: UpdateState
      parameters:
        - name: countryCode
          in: path
          description: ISO code of the country where this state is located in
          required: true
          schema:
            type: string
        - name: stateCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Data of the updated state
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStateRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateStateRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateStateRequest"
        required: true
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            application/json:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            text/json:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
    get:
      tags:
        - Countries
      summary: Returns a state in a country
      operationId: GetState
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
        - name: stateCode
          in: path
          description: Code of the state
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The state including the information about the country
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Country"
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
            text/json:
              schema:
                $ref: "#/components/schemas/Country"
    delete:
      tags:
        - Countries
      summary: Deletes a state
      operationId: DeleteState
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
        - name: stateCode
          in: path
          description: Code of the state
          required: true
          schema:
            type: string
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
  /countries/{countryCode}/cities:
    post:
      tags:
        - Countries
      summary: Creates a new city in a country
      operationId: CreateCity
      parameters:
        - name: countryCode
          in: path
          description: ISO code of the country where this city is located in
          required: true
          schema:
            type: string
      requestBody:
        description: Data of the new city
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
        required: true
      responses:
        "200":
          description: ""
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
    get:
      tags:
        - Countries
      summary: Returns a list of all cities in a country
      operationId: GetCitiesInCountry
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CityWithCountry"
            application/json:
              schema:
                $ref: "#/components/schemas/CityWithCountry"
            text/json:
              schema:
                $ref: "#/components/schemas/CityWithCountry"
  /countries/{countryCode}/cities/{cityId}:
    put:
      tags:
        - Countries
      summary: Updates a city in a country
      operationId: UpdateCity
      parameters:
        - name: countryCode
          in: path
          description: ISO code of the country where this state is located in
          required: true
          schema:
            type: string
        - name: cityId
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
      requestBody:
        description: Data of the updated city
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCityRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateCityRequest"
          application/*+json:
            schema:
