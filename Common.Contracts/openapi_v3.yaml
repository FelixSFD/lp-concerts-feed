components:
  parameters:
    X-LP-Request-Id:
      name: X-LP-Request-Id
      in: header
      description: Unique request id to bypass server caching
      required: false
      schema:
        type: string

    PaginationLimit:
      name: Limit
      in: query
      schema:
        pattern: ^-?(?:0|[1-9]\d*)$
        type: number
        format: uint32
    
    CountryCode:
      description: filter by exact country code
      name: countryCode
      in: query
      schema:
        type: string
    Country:
      description: filter by country name, native name or ISO code
      name: country
      in: query
      schema:
        type: string
    City:
      description: filter by city name or its native name
      name: city
      in: query
      schema:
        type: string
    Venue:
      description: filter by venue name (including previous names)
      name: venue
      in: query
      schema:
        type: string
    CustomConcertTitle:
      description: filter by the custom title field of a concert
      name: customTitle
      in: query
      schema:
        type: string
    Before:
      description: filter by concerts before a date
      name: before
      in: query
      schema:
        type: string
        format: date
    After:
      description: filter by concerts after a date
      name: after
      in: query
      schema:
        type: string
        format: date
    TourId:
      description: filter by exact ID of a tour
      name: tourId
      in: query
      schema:
        type: string
    TourLegId:
      description: filter by exact ID of a tour leg. Should be used together with tourId.
      name: tourLegId
      in: query
      schema:
        type: string
    Username:
      description: filter by username
      name: username
      in: query
      schema:
        type: string
  
  schemas:
    AddTourLegRequest:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    AddVenueNameRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    CityWithCountry:
      required:
        - country
        - countryCode
        - name
        - nativeName
      type: object
      properties:
        country:
          $ref: "#/components/schemas/Country"
        state:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/State"
        countryCode:
          type: string
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type: integer
          format: uint32
        stateCode:
          type: string
        name:
          type: string
        nativeName:
          type: string
    ConcertDetails:
      required:
        - id
        - concertType
        - venue
      type: object
      properties:
        id:
          type: string
        concertType:
          $ref: "#/components/schemas/ConcertType"
        tour:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Tour"
        tourLeg:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TourLeg"
        customTitle:
          type: string
        venue:
          $ref: "#/components/schemas/VenueWithDetails"
        postedStartTime:
          type: string
          format: date-time
        timeIsPlaceholder:
          type: boolean
          description: True if the postedStartTime is a placeholder. This usually is the case for old concerts where we never tracked the times.
        mainStageTime:
          type: string
          format: date-time
        doorsTime:
          type: string
          format: date-time
        lpuEarlyEntryTime:
          type: string
          format: date-time
        lpuEarlyEntryConfirmed:
          type: boolean
        expectedSetDurationMinutes:
          pattern: ^-?(?:0|[1-9]\d*)$
          type: string
          format: uint32
        scheduleImageFile:
          type: string
        deletedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ConcertStatusValue"
        linkinpediaUrl:
          type: string
          description: URL to the concert page on Linkinpedia
    ConcertStatusValue:
      type: string
      enum: 
        - Planned
        - Running
        - Past
        - Cancelled
    ConcertType:
      required:
        - name
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Country:
      required:
        - isoCode
        - name
        - nativeName
      type: object
      properties:
        isoCode:
          maxLength: 3
          minLength: 3
          type: string
        name:
          type: string
        nativeName:
          type: string
    CreateCityRequest:
      required:
        - name
        - nativeName
      type: object
      properties:
        stateCode:
          type: string
        name:
          type: string
        nativeName:
          type: string
    CreateConcertRequest:
