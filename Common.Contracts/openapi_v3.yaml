        metadata:
          $ref: "#/components/schemas/PaginationResponseMetadata"
        users:
          type: array
          description: List of users
          items:
            $ref: "#/components/schemas/User"
    
    # Request/response for file uploads (getting presigned S3-URLs)
    ConcertScheduleUploadRequest:
      type: object
      description: Request to get a S3 url to upload the schedule for a concert
      required: 
        - contentType
      properties:
        contentType:
          type: string
          description: Type of the file to be uploaded
          nullable: false
    ConcertFileUploadResponse:
      type: object
      description: Response that tells the client which URL to use for the upload
      properties:
        uploadUrl:
          type: string
          description: URL to use when uploading the file. This URL is only valid for the requested file
          nullable: false
    
    # Bookmarks
    ConcertBookmarkUpdateRequest:
      type: object
      description: Request to set a bookmark to a concert
      properties:
        status:
          type: string
          description: Bookmark status. Defined if there is a bookmark set and what kind of it
          enum:
            - None
            - Bookmarked
            - Attending
          default: None
          nullable: false
    
    # Schemas from v2
    GetConcertBookmarkCountsResponse:
      type: object
      description: Response from server to tell the number of people who bookmarked or attended a show
      properties:
        bookmarked:
          type: number
          description: Number of users who bookmarked the concert
        attending:
          type: number
          description: Number of users who are attending the concert
        currentUserStatus:
          type: string
          description: Bookmark status. Of the current user
          enum:
            - None
            - Bookmarked
            - Attending
          default: None
          nullable: false
      
    # Error responses
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details response.
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference identifying the problem type.
          default: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri-reference
          description: A URI reference identifying the specific occurrence of the problem.
      additionalProperties: true
  
    # Setlists
    Album:
      type: object
      description: Information about an album
      properties:
        id:
          type: number
          description: ID of the album
        title:
          type: string
          description: Title of the album
          nullable: true
        linkinpediaUrl:
          type: string
          description: URL to the wiki page on Linkinpedia
          nullable: true
          
    Song:
      type: object
      description: Information about a song
      properties:
        id:
          type: number
          description: ID of the song
        title:
          type: string
          description: Title of the song
          nullable: true
        album:
          type: object
          description: Album that contains this song
          nullable: true
          anyOf:
            - $ref: "#/components/schemas/Album"
        isrc:
          type: string
          description: ISRC of the song
          nullable: true
        appleMusicId:
          type: string
          description: Unique ID for the Song on Apple Music
          nullable: true
        linkinpediaUrl:
          type: string
          description: URL to the wiki page on Linkinpedia
          nullable: true
    
    SongVariant:
      type: object
      description: Information about a variation of a song
      properties:
        id:
          type: number
          description: ID of the song variant
        songId:
          type: number
          description: ID of the main version of the song
        isrcOverride:
          type: string
          description: ISRC of the variant if it is different from the normal version
          nullable: true
        appleMusicIdOverride:
          type: string
          description: unique ID for the Song on Apple Music. If not present, the ID of the original song will be used
          nullable: true
        variantName:
          type: string
          description: Name of this variant. This will be visible as the Song-Title in the setlist
        description:
          type: string
          description: Optional description of the variant. What makes this variant different from the original?
          nullable: true
    
    SongMashup:
      type: object
      description: Information about a song mashup. A mashup is used when the band plays a special mix of two or more songs. For example "Remember The Name" and "When They Come For Me" during the FROM ZERO WORLD TOUR 2024-2026.
      properties:
        id:
          type: number
          description: ID of the mashup
        title:
          type: string
          description: Title of the mashup
        linkinpediaUrl:
          type: string
          description: URL to the wiki page on Linkinpedia
          nullable: true
        songs:
          type: array
          description: Songs that are included in this mashup
          items:
            $ref: "#/components/schemas/Song"
    
    SetlistAct:
      type: object
      description: Act within a setlist
      properties:
        setlistId:
          type: number
          description: ID of the setlist that contains this act
        actNumber:
          type: number
          description: Number of the act within the setlist
        title:
          type: string
          description: Title of this act
          nullable: true
    
    SetlistEntrySongExtra:
      type: object
      description: Something added to a song in a setlist entry. And example for this is playing the "Cut The Bridge" bridge in the extended bridge of "Bleed It Out".
      properties:
        id:
          type: string
          description: Unique ID of the extra
        song:
          type: object
          description: The song that has been used in this extra
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Song"
        type:
          type: string
          description: Defines how the SongId was included
          enum: 
            - ExtendedBridge
            - ExtraVerse
        description:
          type: string
          description: Description of the extra
          nullable: true
    
    AddSongExtraToSetlistEntryRequest:
      type: object
      description: Adds an extra to a song in a setlist entry. And example for this is playing the "Cut The Bridge" bridge in the extended bridge of "Bleed It Out".
      properties:
        songId:
          type: number
          description: ID of the song that has been used in this extra
          nullable: true
        type:
          type: string
          description: Defines how the SongId was included
          enum:
            - ExtendedBridge
            - ExtraVerse
        description:
          type: string
          description: Description of the extra
          nullable: true
    
    AddSongExtraToSetlistEntryResponse:
      type: object
      description: Response after an extra was added successfully.
      properties:
        entry:
          type: object
          description: The setlist entry that was updated
          oneOf:
            - $ref: "#/components/schemas/RawSetlistEntry"
    
    SetlistEntry:
      type: object
      description: An entry in a setlist
      properties:
        id:
          type: string
          description: Unique ID of the entry
        actNumber:
          type: number
          description: Number of the act in which this song was played
          nullable: true
        sortNumber:
          type: number
          description: Number to sort the entries
        songNumber:
          type: number
          description: Number of the song in this setlist. Is displayed as an orientation
        playedSong:
          type: object
          description: Song that was played. If not set, they didn't play a song, but a mashup or song variant instead
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Song"
        playedSongVariant:
          type: object
          description: Song variant that was played. If not set, they didn't play a song variant, but a mashup or normal song instead
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/SongVariant"
        playedSongMashup:
          type: object
          description: Song mashup or medley that was played. If not set, they didn't play a mashup, but a song or song variant instead
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/SongMashup"
        title:
          type: string
          description: Title of this setlist entry. This can for example be the title of a song or a mashup
        extraNotes:
          type: string
          description: Field to store additional notes about this entry
          nullable: true
          maxLength: 255
        isrc:
          type: string
          description: ISRC for this entry. This can be used to find the song on Apple Music or Spotify
          nullable: true
        appleMusicId:
          type: string
          description: Unique ID for the Song on Apple Music
          nullable: true
        linkinpediaUrl:
          type: string
          description: URL to the wiki page on Linkinpedia. This value is stored either in the song or the mashup
          nullable: true
        isRotationSong:
          type: boolean
          description: true if this slot is known to rotate between shows on the same tour.
        isPlayedFromRecording:
          type: boolean
          description: true if the song was played from a recording only. Not played live. (this can happen for pre-show-songs for example)
        isWorldPremiere:
          type: boolean
          description: true if this song has not only not been played before, but was not released before this show. For example "Heavy Is The Crown" in Hamburg 2024
        isLivePremiere:
          type: boolean
          description: true if this song was already released, but played live for the first time. For example "Keys To The Kingdom" in Los Angeles 2024
        extras:
          type: array
          description: Extras for this song. For example playing the bridge of another song in the bridge of this song
          items:
            $ref: "#/components/schemas/SetlistEntrySongExtra"
    
    SetlistHeader:
      type: object
      description: Information about a setlist including all entries
      properties:
        id:
          type: number
          description: ID of the setlist
          example: 1
        concertId:
          type: string
          description: ID of the concert where this set was played
          example: e710bebe-13b8-4cfb-aa84-ff6c208d5c21
        concertTitle:
          type: string
          description: Title of the concert
          example: Hamburg 22.09.2024
        setName:
          type: string
          description: Name of the set
          example: Set A
          nullable: true
        linkinpediaUrl:
          type: string
          description: URL to the wiki page on Linkinpedia
          nullable: true
    
    Setlist:
