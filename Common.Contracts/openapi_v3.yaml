            type: string
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTourLegRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/AddTourLegRequest"
          application/*+json:
            schema:
