        required: true
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            application/json:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            text/json:
