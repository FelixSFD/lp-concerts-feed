        - username
      properties: 
        id:
          type: string
          description: Unique identifier of the user
        username:
          type: string
          description: Username of the user
        originCountryCode:
          type: string
          description: ISO code of the country where this user is from. Can be null if the user has not specified their country
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Date and time when the user was created
        updatedAt:
          type: string
          format: date-time
          description: Date and time when the user was last updated
    
    UpdateUserProfile:
      description: Information about a user to be updated
      type: object
      required: 
        - username
      properties:
        username:
          type: string
          description: Username of the user
        originCountryCode:
          type: string
          description: ISO code of the country where this user is from. Can be null if the user has not specified their country
          nullable: true
    
    # Paginated responses
    PaginationResponseMetadata:
      description: Metadata for pagination
      type: object
      properties:
        offset:
          type: integer
