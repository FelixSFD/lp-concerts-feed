openapi: 3.1.1
info:
  title: LPshows.live API v3
  description: This is the API for the Linkin Park Concert Calendar fan project
  version: 3.0.0
servers:
  - url: http://localhost:5133/
paths:
  /Concerts:
    post:
      tags:
        - Concerts
      summary: Creates a new concert in the database
      operationId: CreateConcert
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConcertRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateConcertRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateConcertRequest"
        required: true
      responses:
        "200":
          description: the created concert
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
    get:
      tags:
        - Concerts
      summary: Returns a list of concerts that can be filtered
      operationId: GetConcerts
      parameters:
        - name: CountryCode
          in: query
          schema:
            type: string
        - name: Limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: uint32
        - name: Skip
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: uint32
        - name: OrderBy
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: List of concerts including referenced objects
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
  /Concerts/{concertId}:
    put:
      tags:
        - Concerts
      summary: Updates a concert in the database
      operationId: UpdateConcert
      parameters:
        - name: concertId
          in: path
          description: ID of the concert to update
          required: true
          schema:
            type: string
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateConcertRequest"
        required: true
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
    get:
      tags:
        - Concerts
      summary: Returns a concert without loading the referenced objects like the venue
        details
      operationId: GetRawConcertById
      parameters:
        - name: concertId
          in: path
          description: ""
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/RawConcert"
            application/json:
              schema:
                $ref: "#/components/schemas/RawConcert"
            text/json:
              schema:
                $ref: "#/components/schemas/RawConcert"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
    delete:
      tags:
        - Concerts
      summary: Deletes a concert. Note that the data will not be fully removed from
        the database. Admins will still be able to see deleted concerts.
      operationId: DeleteConcertById
      parameters:
        - name: concertId
          in: path
          description: ID of the concert to delete
          required: true
          schema:
            type: string
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
  /Concerts/{concertId}/details:
    get:
      tags:
        - Concerts
      summary: Returns all details about a concert. This includes information about
        the venue and general location.
      operationId: GetConcertById
      parameters:
        - name: concertId
          in: path
          description: ""
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
  /ConcertTypes:
    post:
      tags:
        - ConcertTypes
      summary: Creates a new type of concert
      operationId: CreateConcertType
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConcertTypeRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateConcertTypeRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateConcertTypeRequest"
        required: true
      responses:
        "200":
          description: ""
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
    get:
      tags:
        - ConcertTypes
      summary: Returns all available concert types
      operationId: GetConcertTypes
      responses:
        "200":
          description: information about the concert types
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertType"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
  /ConcertTypes/{concertTypeId}:
    get:
      tags:
        - ConcertTypes
      summary: Returns information about a concert type
      operationId: GetTypeById
      parameters:
        - name: concertTypeId
          in: path
          description: ID of the concert type
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
      responses:
        "200":
          description: information about the concert type
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertType"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
    put:
      tags:
        - ConcertTypes
      summary: Updates information of a concert type
      operationId: UpdateType
      parameters:
        - name: concertTypeId
          in: path
          description: ID of the concert type
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertTypeRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertTypeRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateConcertTypeRequest"
        required: true
      responses:
        "200":
          description: updated information about the concert type
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertType"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
  /countries:
    post:
      tags:
        - Countries
      summary: Creates a new country
      operationId: CreateCountry
      requestBody:
        description: Data of the new country
        content:
          application/json:
