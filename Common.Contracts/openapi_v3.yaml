components:
  schemas:
    AddTourLegRequest:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    AddVenueNameRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    CityWithCountry:
      required:
        - country
        - countryCode
        - name
        - nativeName
      type: object
      properties:
        country:
          $ref: "#/components/schemas/Country"
        state:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/State"
        countryCode:
          type: string
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type: string
          format: uint32
        stateCode:
          type: string
        name:
          type: string
        nativeName:
          type: string
    ConcertDetails:
      required:
        - id
        - concertType
        - venue
      type: object
      properties:
        id:
          type: string
        concertType:
          $ref: "#/components/schemas/ConcertType"
        tour:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Tour"
        tourLeg:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TourLeg"
        customTitle:
          type: string
        venue:
          $ref: "#/components/schemas/VenueWithDetails"
        postedStartTime:
          type: string
          format: date-time
        mainStageTime:
          type: string
          format: date-time
        doorsTime:
          type: string
          format: date-time
        lpuEarlyEntryTime:
          type: string
          format: date-time
        lpuEarlyEntryConfirmed:
          type: boolean
        expectedSetDurationMinutes:
          pattern: ^-?(?:0|[1-9]\d*)$
          type: string
          format: uint32
        scheduleImageFile:
          type: string
        deletedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ConcertStatusValue"
    ConcertStatusValue:
      type: string
      enum: 
        - Planned
        - Running
        - Past
        - Cancelled
    ConcertType:
      required:
        - name
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Country:
      required:
        - isoCode
        - name
        - nativeName
      type: object
      properties:
        isoCode:
          maxLength: 3
          minLength: 3
          type: string
        name:
          type: string
        nativeName:
          type: string
    CreateCityRequest:
      required:
        - name
        - nativeName
      type: object
