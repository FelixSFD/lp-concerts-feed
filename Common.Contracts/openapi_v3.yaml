            perform this operation"
      security:
        - Bearer: []
  /Tours/{tourId}/legs/{legId}:
    get:
      tags:
        - Tours
      summary: Returns information about a tour leg
      operationId: GetTourLeg
      parameters:
        - name: tourId
          in: path
          description: ID of the tour
          required: true
          schema:
            type: string
        - name: legId
          in: path
          description: ID of the tour leg
          required: true
          schema:
            type: string
      responses:
        "200":
          description: information about the leg
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/TourLeg"
            application/json:
              schema:
                $ref: "#/components/schemas/TourLeg"
            text/json:
              schema:
                $ref: "#/components/schemas/TourLeg"
    delete:
      tags:
        - Tours
      summary: Deletes a leg of a tour
      operationId: DeleteTourLeg
      parameters:
        - name: tourId
          in: path
          description: ID of the tour
          required: true
          schema:
            type: string
        - name: legId
          in: path
          description: ID of the tour leg
          required: true
          schema:
            type: string
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      security:
        - Bearer: []
  /Venues:
    post:
      tags:
        - Venues
      summary: Creates a new venue
      operationId: CreateVenue
      requestBody:
