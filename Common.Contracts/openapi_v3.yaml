      operationId: GetTours
      responses:
        "200":
          description: List of all tours
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tour"
            text/json:
              schema:
                type: array
                items:
