openapi: 3.0.4
info:
  title: LPshows.live API v3
  description: This is the API for the Linkin Park Concert Calendar fan project
  version: 3.0.0
servers:
  - url: /
  - url: http://localhost:5133
paths:
  /v3/Concerts:
    post:
      tags:
        - Concerts
      summary: Creates a new concert in the database
      operationId: CreateConcert
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConcertRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateConcertRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateConcertRequest"
        required: true
      responses:
        "200":
          description: the created concert
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: POST
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts
      security:
        - Bearer: []
    get:
      tags:
        - Concerts
      summary: Returns a list of concerts that can be filtered
      operationId: GetConcerts
      parameters:
        - name: CountryCode
          in: query
          schema:
            type: string
        - name: Limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: string
            format: uint32
        - name: Skip
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: string
            format: uint32
        - name: OrderBy
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: List of concerts including referenced objects
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConcertDetails"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts
  
  /v3/Concerts/{concertId}:
    put:
      tags:
        - Concerts
      summary: Updates a concert in the database
      operationId: UpdateConcert
      parameters:
        - name: concertId
          in: path
          description: ID of the concert to update
          required: true
          schema:
            type: string
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateConcertRequest"
        required: true
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: PUT
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
      security:
        - Bearer: []
    get:
      tags:
        - Concerts
      summary: Returns a concert without loading the referenced objects like the venue
        details
      operationId: GetRawConcertById
      parameters:
        - name: concertId
          in: path
          description: ""
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/RawConcert"
            application/json:
              schema:
                $ref: "#/components/schemas/RawConcert"
            text/json:
              schema:
                $ref: "#/components/schemas/RawConcert"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
      security:
        - Bearer: []
    delete:
      tags:
        - Concerts
      summary: Deletes a concert. Note that the data will not be fully removed from
        the database. Admins will still be able to see deleted concerts.
      operationId: DeleteConcertById
      parameters:
        - name: concertId
          in: path
          description: ID of the concert to delete
          required: true
          schema:
            type: string
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: DELETE
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
      security:
        - Bearer: []
  /v3/Concerts/{concertId}/details:
    get:
      tags:
        - Concerts
      summary: Returns all details about a concert. This includes information about
        the venue and general location.
      operationId: GetConcertById
      parameters:
        - name: concertId
          in: path
          description: ""
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertDetails"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/Concerts/{concertId}/details
        requestParameters:
          integration.request.path.concertId: method.request.path.concertId
  
  /v2/concerts/{id}/bookmarks/count:
    get:
      operationId: GetBookmarkCountForConcert
      summary: Checks how many bookmarks there are for a concert. Use GetBookmarkStatusForConcert if you want to check the status for the current user
      tags:
        - concerts
      parameters:
        - in: path
          name: id
          description: ID of the concert
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Found the number of bookmarks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConcertBookmarkCountsResponse"
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn:
                Fn::ImportValue:
                  Fn::Sub: "${BaseProductName}-lambda-concert-bookmarks-read-function"
        responses:
          default:
            statusCode: "200"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        contentHandling: "CONVERT_TO_TEXT"
        type: "aws_proxy"
  
  /v3/ConcertTypes:
    post:
      tags:
        - ConcertTypes
      summary: Creates a new type of concert
      operationId: CreateConcertType
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConcertTypeRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateConcertTypeRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateConcertTypeRequest"
        required: true
      responses:
        "200":
          description: ""
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: POST
        uri: https://api.dev.lpshows.felixsfd.de/v3/ConcertTypes
      security:
        - Bearer: []
    get:
      tags:
        - ConcertTypes
      summary: Returns all available concert types
      operationId: GetConcertTypes
      responses:
        "200":
          description: information about the concert types
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertType"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/ConcertTypes
      security:
        - Bearer: []
  
  /v3/ConcertTypes/{concertTypeId}:
    get:
      tags:
        - ConcertTypes
      summary: Returns information about a concert type
      operationId: GetTypeById
      parameters:
        - name: concertTypeId
          in: path
          description: ID of the concert type
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
      responses:
        "200":
          description: information about the concert type
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertType"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/ConcertTypes/{concertTypeId}
        requestParameters:
          integration.request.path.concertId: method.request.path.concertTypeId
    put:
      tags:
        - ConcertTypes
      summary: Updates information of a concert type
      operationId: UpdateType
      parameters:
        - name: concertTypeId
          in: path
          description: ID of the concert type
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type: integer
            format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertTypeRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateConcertTypeRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateConcertTypeRequest"
        required: true
      responses:
        "200":
          description: updated information about the concert type
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ConcertType"
            application/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
            text/json:
              schema:
                $ref: "#/components/schemas/ConcertType"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: PUT
        uri: https://api.dev.lpshows.felixsfd.de/v3/ConcertTypes/{concertTypeId}
        requestParameters:
          integration.request.path.concertId: method.request.path.concertTypeId
  /v3/countries:
    post:
      tags:
        - Countries
      summary: Creates a new country
      operationId: CreateCountry
      requestBody:
        description: Data of the new country
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCountryRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateCountryRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateCountryRequest"
        required: true
      responses:
        "200":
          description: ""
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: POST
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries
      security:
        - Bearer: []
    get:
      tags:
        - Countries
      summary: Returns a list of all countries
      operationId: GetCountries
      responses:
        "200":
          description: List of all countries
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries
  /v3/countries/{countryCode}:
    put:
      tags:
        - Countries
      summary: Updates an existing country
      operationId: UpdateCountry
      parameters:
        - name: countryCode
          in: path
          description: ISO-code of the country
          required: true
          schema:
            type: string
      requestBody:
        description: new data of the country
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCountryRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateCountryRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateCountryRequest"
        required: true
      responses:
        "200":
          description: the updated data
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Country"
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
            text/json:
              schema:
                $ref: "#/components/schemas/Country"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: PUT
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
      security:
        - Bearer: []
    get:
      tags:
        - Countries
      summary: Returns a country by its ISO code
      operationId: GetCountryByIsoCode
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Country"
            application/json:
              schema:
                $ref: "#/components/schemas/Country"
            text/json:
              schema:
                $ref: "#/components/schemas/Country"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
    delete:
      tags:
        - Countries
      summary: Deletes a country
      operationId: DeleteCountryByIsoCode
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: DELETE
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
      security:
        - Bearer: []
  /v3/countries/{countryCode}/states:
    post:
      tags:
        - Countries
      summary: Creates a new state in a country
      operationId: CreateState
      parameters:
        - name: countryCode
          in: path
          description: ISO code of the country where this state is located in
          required: true
          schema:
            type: string
      requestBody:
        description: Data of the new country
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStateRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateStateRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateStateRequest"
        required: true
      responses:
        "200":
          description: ""
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: POST
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}/states
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
      security:
        - Bearer: []
    get:
      tags:
        - Countries
      summary: Returns a list of all states in a country
      operationId: GetStatesInCountry
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateWithCountry"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateWithCountry"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateWithCountry"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}/states
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
  
  /v3/countries/{countryCode}/states/{stateCode}:
    put:
      tags:
        - Countries
      summary: Updates a state in a country
      operationId: UpdateState
      parameters:
        - name: countryCode
          in: path
          description: ISO code of the country where this state is located in
          required: true
          schema:
            type: string
        - name: stateCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Data of the updated state
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStateRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateStateRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateStateRequest"
        required: true
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            application/json:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            text/json:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: PUT
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}/states/{stateCode}
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
          integration.request.path.stateCode: method.request.path.stateCode
      security:
        - Bearer: []
    get:
      tags:
        - Countries
      summary: Returns a state in a country
      operationId: GetState
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
        - name: stateCode
          in: path
          description: Code of the state
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The state including the information about the country
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            application/json:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
            text/json:
              schema:
                $ref: "#/components/schemas/StateWithCountry"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}/states/{stateCode}
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
          integration.request.path.stateCode: method.request.path.stateCode
    delete:
      tags:
        - Countries
      summary: Deletes a state
      operationId: DeleteState
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
        - name: stateCode
          in: path
          description: Code of the state
          required: true
          schema:
            type: string
      responses:
        "200":
          description: no content
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: DELETE
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}/states/{stateCode}
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
          integration.request.path.stateCode: method.request.path.stateCode
      security:
        - Bearer: []
  
  /v3/countries/{countryCode}/cities:
    post:
      tags:
        - Countries
      summary: Creates a new city in a country
      operationId: CreateCity
      parameters:
        - name: countryCode
          in: path
          description: ISO code of the country where this city is located in
          required: true
          schema:
            type: string
      requestBody:
        description: Data of the new city
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateCityRequest"
        required: true
      responses:
        "200":
          description: ""
        "401":
          description: "Unauthorized: Credentials are missing or not valid"
        "403":
          description: "Forbidden: Credentials are valid, but the caller is not allowed to
            perform this operation"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: POST
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}/cities
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
      security:
        - Bearer: []
    get:
      tags:
        - Countries
      summary: Returns a list of all cities in a country
      operationId: GetCitiesInCountry
      parameters:
        - name: countryCode
          in: path
          description: 3-letter ISO-code of the country
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityWithCountry"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityWithCountry"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityWithCountry"
      x-amazon-apigateway-integration:
        type: HTTP_PROXY
        httpMethod: GET
        uri: https://api.dev.lpshows.felixsfd.de/v3/countries/{countryCode}/cities
        requestParameters:
          integration.request.path.concertId: method.request.path.countryCode
  
  /v3/countries/{countryCode}/cities/{cityId}:
    put:
      tags:
        - Countries
      summary: Updates a city in a country
      operationId: UpdateCity
      parameters:
        - name: countryCode
          in: path
          description: ISO code of the country where this state is located in
          required: true
