<p-dialog
  [(visible)]="showProfileSetup$"
  [modal]="true"
  header="Complete your profile"
  styleClass="rounded-none"
>
  <app-complete-user-profile (onProfileCompleted)="onProfileCompleted()" [visible]="showProfileSetup$" />
</p-dialog>

<div class="app-shell">
  <div class="sticky top-0 z-5 app-header-bar">
    <app-main-menu [clock]="currentDateTime$" [isLoggedIn]="isAuthenticated$" />
    <div [class]="(routerProgress == 1 ? 'progress-hidden' : 'progress-visible')">
      <p-progress-bar [value]="routerProgress * 100" style="height: 2px" showValue="false" role="progressbar"  />
    </div>
  </div>

  <main class="app-main grid justify-content-center m-0 py-3">
    <div class="w-full sm:w-10 md:w-10 lg:w-8">
      <app-auto-breadcrumbs />

      <!-- Content -->
      <div class="mt-2">
        <router-outlet />
      </div>
    </div>
  </main>

  <app-footer />
</div>

<p-scroll-top behavior="smooth" aria-label="Scroll to top" />
<p-toast position="bottom-right" life="4000" />
