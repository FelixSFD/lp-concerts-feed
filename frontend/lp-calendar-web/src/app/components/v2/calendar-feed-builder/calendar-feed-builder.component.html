<form [formGroup]="feedBuilderForm()" class="form">
  <div class="flex align-items-center mb-2">
    <p-toggleswitch inputId="doorsTimeSwitch" formControlName="includeDoorsTime" />
    <label class="form-check-label ml-2" for="doorsTimeSwitch">Doors time</label>
  </div>

  <div class="flex align-items-center">
    <p-toggleswitch inputId="lpStageTimeSwitch" formControlName="includeLpStageTime" />
    <label class="form-check-label ml-2" for="lpStageTimeSwitch">Linkin Park stage time</label>
  </div>
</form>
