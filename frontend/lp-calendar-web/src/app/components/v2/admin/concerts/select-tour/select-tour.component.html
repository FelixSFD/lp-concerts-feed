<p-select
  [options]="tours"
  optionLabel="name"
  optionValue="id"
  [(ngModel)]="value"
  (ngModelChange)="onValueChange($event)"
  (onBlur)="onBlur()"
  [placeholder]="placeholder"
  [inputId]="inputId"
  [fluid]="fluid"
  [showClear]="showClear"
  [filter]="filter"
  [disabled]="disabled"
  [invalid]="invalid"
  [loading]="loading"
/>
