<p-confirmdialog />

<p-card>
  <ng-template #title>
    Manage concerts
  </ng-template>

  <p-table
    #dtConcerts
    [value]="concerts$()"
    dataKey="id"
    stripedRows
    rowHover
    [rows]="25"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    [loading]="isLoading$()"
    [paginator]="true"
    [globalFilterFields]="['customTitle', 'venue.currentName', 'id']"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template #caption>
      <div class="flex">
        <p-button variant="outlined" label="Add concert" [routerLink]="['add']" />

        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            pInputText
            type="text"
            [(ngModel)]="globalSearchText$"
            (input)="dtConcerts.filterGlobal(globalSearchText$, 'contains')"
            placeholder="Search keyword"
          />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th scope="col">Title</th>
        <th scope="col">Venue</th>
        <th scope="col">ID</th>
        <th scope="col"></th>
      </tr>
      <tr>
        <th>
          <p-column-filter type="text" field="customTitle" placeholder="Title" ariaLabel="Filter Concert Titles" filterOn="input" />
        </th>
        <th>
          <p-column-filter type="text" field="venue.currentName" placeholder="Venue" ariaLabel="Filter Venues" filterOn="input" />
        </th>
        <th>
          <p-column-filter type="text" field="id" placeholder="ID" ariaLabel="Filter Concert IDs" filterOn="input" />
        </th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-concert>
      <tr>
        <td>{{ concert.customTitle ?? '-' }}</td>
        <td>{{ concert.venue?.currentName ?? '-' }}</td>
        <td><code>{{ concert.id }}</code></td>
        <td>
          <p-button-group>
            <p-button
              label="Edit"
              icon="pi pi-pencil"
              variant="outlined"
              size="small"
              [routerLink]="[concert.id]"
              [disabled]="isDeletingConcert$()"
            />
            <p-button
              label="Delete"
              icon="pi pi-trash"
              variant="outlined"
              size="small"
              severity="danger"
              (click)="onDeleteConcertClicked($event, concert)"
              [disabled]="isDeletingConcert$()"
            />
          </p-button-group>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="text-center text-secondary">
          @if (isLoading$()) {
            Loading concerts...
          } @else {
            No concerts found.
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
