<p-confirmdialog />

<p-card>
  <ng-template #title>
    <div class="flex flex-row justify-content-between align-items-center">
      <span>{{ currentConcertTitle ? 'Edit ' + currentConcertTitle : 'Edit concert' }}</span>
    </div>
  </ng-template>

  <p-button
    severity="secondary"
    variant="outlined"
    icon="pi pi-arrow-left"
    label="Concert list"
    [routerLink]="['../']"
  />

  <app-concert-form
    [is-saving]="isSaving$"
    [is-edit]="true"
    [standalone]="true"
  />
</p-card>
