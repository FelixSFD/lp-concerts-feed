<p-confirmdialog />

<p-card>
  <ng-template #title>
    <div class="flex flex-row justify-content-between align-items-center">
      <span>{{ currentConcertTitle ? 'Edit ' + currentConcertTitle : 'Edit concert' }}</span>
    </div>
  </ng-template>

  <p-button
    severity="secondary"
    variant="outlined"
    icon="pi pi-arrow-left"
    label="Concert list"
    [routerLink]="['../']"
  />

  <p-button
    label="Previous show"
    icon="pi pi-arrow-left"
    variant="text"
    severity="secondary"
    [disabled]="previousConcertId() == null"
    [routerLink]="previousConcertId() ? ['../', previousConcertId()] : null"
    ariaLabel="Previous show"
  />
  <p-button
    label="Next show"
    icon="pi pi-arrow-right"
    iconPos="right"
    variant="text"
    severity="secondary"
    [disabled]="nextConcertId() == null"
    [routerLink]="nextConcertId() ? ['../', nextConcertId()] : null"
    ariaLabel="Next show"
  />

  <app-concert-form
    [is-saving]="isSaving()"
    (saveClicked)="onSaveClicked($event)"
    [is-edit]="true"
    [standalone]="false"
    #concertForm
  />

  <ng-template #footer>
    <p-divider />
    <div class="flex gap-4 mt-1 align-content-end justify-content-end">
      <p-button [label]="isSaving() ? 'Saving...' : 'Save'" [loading]="isSaving()" (onClick)="concertForm.onSaveClicked()" [disabled]="isSaving() || concertForm.concertForm.invalid" />
    </div>
  </ng-template>
</p-card>
