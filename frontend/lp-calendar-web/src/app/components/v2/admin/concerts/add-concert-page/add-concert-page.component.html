<p-card>
  <ng-template #title>
    <div class="flex flex-row justify-content-between align-items-center">
      <span>Create concert</span>
    </div>
  </ng-template>

  <p-button
    severity="secondary"
    variant="outlined"
    icon="pi pi-arrow-left"
    label="Concert list"
    [routerLink]="['../']"
  />

  <div class="mt-3">
    <app-concert-form
      (saveClicked)="onSaveClicked($event)"
      [is-saving]="isSaving()"
      [standalone]="false"
      #concertForm
    />
  </div>

  <ng-template #footer>
    <p-divider />
    <div class="flex gap-4 mt-1 align-content-end justify-content-end">
      <p-button [label]="isSaving() ? 'Adding...' : 'Add'" [loading]="isSaving()" (onClick)="concertForm.onSaveClicked()" [disabled]="isSaving() || concertForm.concertForm.invalid" />
    </div>
  </ng-template>
</p-card>
