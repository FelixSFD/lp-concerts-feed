<p-card>
  <ng-template #title>
    <div class="flex flex-row justify-content-between align-items-center">
      <span>Create concert</span>
    </div>
  </ng-template>

  <p-button
    severity="secondary"
    variant="outlined"
    icon="pi pi-arrow-left"
    label="Concert list"
    [routerLink]="['../']"
  />

  <app-concert-form
    (saveClicked)="onSaveClicked($event)"
    [is-saving]="isSaving$"
  />
</p-card>
