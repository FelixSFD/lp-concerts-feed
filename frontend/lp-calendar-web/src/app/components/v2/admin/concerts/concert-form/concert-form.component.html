<form #form="ngForm" [formGroup]="concertForm" class="form">
  <ng-template #formInputsGeneral>
    <p-card>
      <ng-template #subtitle>
        General
      </ng-template>
      <div class="grid row-gap-2">
        <div class="col-12">
          <p-floatlabel variant="on">
            <app-select-concert-type
              formControlName="concertTypeId"
              inputId="concertTypeId"
              fluid
            />
            <label for="concertTypeId">Concert Type</label>
          </p-floatlabel>
        </div>

        <div class="col-12 xl:col-6">
          <p-floatlabel variant="on">
            <app-select-tour
              formControlName="tour"
              inputId="tourId"
              showClear
              fluid
            />
            <label for="tourId">Tour</label>
          </p-floatlabel>
        </div>

        <div class="col-12 xl:col-6">
          <p-floatlabel variant="on">
            <app-select-tour-leg
              formControlName="tourLegId"
              inputId="tourLegId"
              [tour]="concertForm.controls.tour.value"
              showClear
              fluid
            />
            <label for="tourLegId">Tour Leg</label>
          </p-floatlabel>
        </div>

        <div class="col-12">
          <p-floatlabel variant="on">
            <input pInputText id="customTitle" formControlName="customTitle" autocomplete="off" fluid [invalid]="concertForm.controls.customTitle.invalid" />
            <label for="customTitle">Custom Title</label>
          </p-floatlabel>
        </div>
      </div>
    </p-card>

    <p-card>
      <ng-template #subtitle>
        Timing information
      </ng-template>

      <!-- Posted start time -->
      <div class="col-12">
        <div class="flex flex-wrap gap-3">
          <div>
            <p-floatlabel variant="on">
              <p-date-picker formControlName="postedStartTime" inputId="postedStartTime" showIcon iconDisplay="input" [showTime]="true" />
              <label for="postedStartTime">Start time</label>
            </p-floatlabel>
            <small>(according to ticket vendor)</small>
          </div>

          <div>
            <p-inputgroup>
              <p-floatlabel variant="on">
                <p-select [options]="timezones" optionValue="tzCode" optionLabel="label" formControlName="timezone" id="timezone" [fluid]="false" filter />
                <label for="timezone">Venue's timezone</label>
              </p-floatlabel>
              <p-inputgroup-addon class="w-full">
                <!--<p-button class="md:hidden" icon="pi pi-sync" variant="outlined" (onClick)="onUpdateTimeZoneClicked()" [disabled]="timeZoneIsLoading$" [loading]="timeZoneIsLoading$" />
                <p-button class="hidden md:inline" label="Load timezone" icon="pi pi-sync" variant="outlined" (onClick)="onUpdateTimeZoneClicked()" [disabled]="timeZoneIsLoading$" [loading]="timeZoneIsLoading$" />-->
              </p-inputgroup-addon>
            </p-inputgroup>
          </div>
        </div>
      </div>
    </p-card>
  </ng-template>

  @if (standalone$) {
    <p-card class="mt-3">
      <ng-container *ngTemplateOutlet="formInputsGeneral" />

      <ng-template #footer>
        <p-divider />
        <div class="flex gap-4 mt-1 align-content-end justify-content-end">
          <p-button [label]="isSaving$ ? 'Saving...' : 'Save'" [loading]="isSaving$" (onClick)="onSaveClicked()" [disabled]="isSaving$ || !concertForm.valid" />
        </div>
      </ng-template>
    </p-card>
  } @else {
    <ng-container *ngTemplateOutlet="formInputsGeneral" />
  }
</form>
