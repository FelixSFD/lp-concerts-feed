<p-dialog [(visible)]="isShowingImportDialog" header="Import data from Linkinpedia" [modal]="true">
  <div class="mt-1">
    <app-import-concert-dialog-content [import-plan]="importPlan" (applyClicked)="onApplyImportClicked($event)" />
  </div>
</p-dialog>

<form #form="ngForm" [formGroup]="concertForm" class="form mt-3">
  <ng-template #formInputsGeneral>
    <p-card>
      <ng-template #subtitle>
        General
      </ng-template>
      <div class="grid row-gap-2 mt-2">
        <!-- Linkinpedia URL -->
        <div class="col-12">
          <div class="flex flex-nowrap gap-3">
            <p-inputgroup>
              <p-floatlabel variant="on">
                <input pInputText id="linkinpediaUrl" fluid formControlName="linkinpediaUrl" [invalid]="concertForm.controls.linkinpediaUrl.invalid" />
                <label for="linkinpediaUrl">Linkinpedia URL</label>
              </p-floatlabel>
              <p-inputgroup-addon>
                <p-button icon="pi pi-external-link" label="Open" severity="info" variant="outlined" [disabled]="concertForm.controls.linkinpediaUrl.invalid || concertForm.value.linkinpediaUrl == null" (onClick)="openLinkinpediaUrlClicked()" />
              </p-inputgroup-addon>
            </p-inputgroup>

            <div class="w-10rem">
              <p-button label="Import&nbsp;data" icon="pi pi-download" variant="outlined" (onClick)="importFromLinkinpediaUrlClicked()" />
            </div>
          </div>
        </div>

        <p-divider />

        <!-- Concert Status -->
        <div class="col-12">
          <p-floatlabel variant="on">
            <p-select [options]="concertStatusValues" [invalid]="concertForm.controls.concertStatus.invalid" optionLabel="label" optionValue="value" formControlName="concertStatus" id="concertStatus" fluid />
            <label for="concertStatus">Status</label>
          </p-floatlabel>
        </div>

        <div class="col-12">
          <p-floatlabel variant="on">
            <app-select-concert-type
              formControlName="concertTypeId"
              inputId="concertTypeId"
              [invalid]="concertForm.controls.concertTypeId.invalid"
              fluid
            />
            <label for="concertTypeId">Concert Type</label>
          </p-floatlabel>
        </div>

        <div class="col-12 xl:col-6">
          <p-floatlabel variant="on">
            <app-select-tour
              formControlName="tour"
              inputId="tourId"
              [invalid]="concertForm.controls.tour.invalid"
              showClear
              fluid
            />
            <label for="tourId">Tour</label>
          </p-floatlabel>
        </div>

        <div class="col-12 xl:col-6">
          <p-floatlabel variant="on">
            <app-select-tour-leg
              formControlName="tourLegId"
              inputId="tourLegId"
              [tour]="concertForm.controls.tour.value"
              [invalid]="concertForm.controls.tourLegId.invalid"
              showClear
              fluid
            />
            <label for="tourLegId">Tour Leg</label>
          </p-floatlabel>
        </div>

        <div class="col-12">
          <p-floatlabel variant="on">
            <input pInputText id="customTitle" formControlName="customTitle" autocomplete="off" fluid [invalid]="concertForm.controls.customTitle.invalid" />
            <label for="customTitle">Custom Title</label>
          </p-floatlabel>
        </div>
      </div>
    </p-card>

    <p-card class="mt-3">
      <ng-template #subtitle>
        Location information
      </ng-template>
      <div class="grid row-gap-2 mt-2">
        <div class="col-12">
          <app-select-venue
            formControlName="venue"
            inputId="venue"
            [invalid]="concertForm.controls.venue.invalid"
            openVenueButton="true"
            showClear
            fluid
          />
        </div>
      </div>
    </p-card>

    <p-card class="mt-3">
      <ng-template #subtitle>
        Timing information
      </ng-template>

      <div class="grid mt-2">
        <!-- Posted start time -->
        <div class="col-12">
          <div class="flex flex-wrap gap-3">
            <div>
              <p-floatlabel variant="on">
                <p-date-picker formControlName="postedStartTime" inputId="postedStartTime" showIcon iconDisplay="input" [showTime]="true" [invalid]="concertForm.controls.postedStartTime.invalid" />
                <label for="postedStartTime">Start time</label>
              </p-floatlabel>
              <small>(according to ticket vendor)</small>
            </div>

            <div class="align-content-center pb-3">
              Timezone: {{ venueTimezone()?.label }}
            </div>
          </div>
        </div>

        <!-- Official Doors Time -->
        <div class="col-12 sm:col-12 md:col-6 xl:col-3">
          <p-floatlabel variant="on">
            <input pInputText id="doorsTime" formControlName="doorsTime" autocomplete="off" type="time" [invalid]="concertForm.controls.doorsTime.invalid" fluid />
            <label for="doorsTime">Doors time</label>
          </p-floatlabel>
        </div>

        <!-- LP stage Time -->
        <div class="col-12 sm:col-12 md:col-6 xl:col-3">
          <p-floatlabel variant="on">
            <input pInputText id="lpStageTime" formControlName="lpStageTime" autocomplete="off" type="time" [invalid]="concertForm.controls.lpStageTime.invalid" fluid />
            <label for="lpStageTime">Confirmed Linkin Park stage time</label>
          </p-floatlabel>
        </div>

        <!-- Expected set duration -->
        <div class="col-12 sm:col-12 md:col-6 xl:col-3">
          <p-floatlabel variant="on">
            <p-date-picker formControlName="expectedSetDuration" inputId="expectedSetDuration" showIcon [showButtonBar]="true" iconDisplay="input" [timeOnly]="true" [invalid]="concertForm.controls.expectedSetDuration.invalid" fluid>
              <ng-template #buttonbar let-todayCallback="todayCallback" let-clearCallback="clearCallback">
                <div class="flex justify-between w-full">
                  <div class="flex gap-2">
                    <p-button size="small" label="2h" severity="primary" variant="outlined" (onClick)="setExpectedSetDuration(120)" />
                    <p-button size="small" label="90 min" severity="secondary" variant="outlined" (onClick)="setExpectedSetDuration(90)" />
                    <p-button size="small" label="1h" severity="secondary" variant="outlined" (onClick)="setExpectedSetDuration(60)" />
                  </div>
                  <div class="flex gap-2">
                    <p-button size="small" icon="pi pi-times" severity="danger" variant="text" (click)="clearCallback($event)" />
                  </div>
                </div>
              </ng-template>
            </p-date-picker>
            <label for="expectedSetDuration">Expected set duration</label>
          </p-floatlabel>
        </div>
      </div>
    </p-card>
  </ng-template>

  @if (standalone$) {
    <p-card class="mt-3">
      <ng-container *ngTemplateOutlet="formInputsGeneral" />

      <ng-template #footer>
        <p-divider />
        <div class="flex gap-4 mt-1 align-content-end justify-content-end">
          <p-button [label]="isSaving$ ? 'Saving...' : 'Save'" [loading]="isSaving$" (onClick)="onSaveClicked()" [disabled]="isSaving$ || !concertForm.valid" />
        </div>
      </ng-template>
    </p-card>
  } @else {
    <ng-container *ngTemplateOutlet="formInputsGeneral" />
  }
</form>
