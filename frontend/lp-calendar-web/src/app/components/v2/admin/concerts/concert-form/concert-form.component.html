<form #form="ngForm" [formGroup]="concertForm" class="form">
  <ng-template #formInputsGeneral>
    <p-card>
      <ng-template #subtitle>
        General
      </ng-template>
      <div class="grid row-gap-2">
        <div class="col-12">
          <p-floatlabel variant="on">
            <app-select-concert-type
              formControlName="concertTypeId"
              inputId="concertTypeId"
              fluid
            />
            <label for="concertTypeId">Concert Type</label>
          </p-floatlabel>
        </div>

        <div class="col-12 xl:col-6">
          <p-floatlabel variant="on">
            <app-select-tour
              formControlName="tour"
              inputId="tourId"
              showClear
              fluid
            />
            <label for="tourId">Tour</label>
          </p-floatlabel>
        </div>

        <div class="col-12 xl:col-6">
          <p-floatlabel variant="on">
            <app-select-tour-leg
              formControlName="tourLegId"
              inputId="tourLegId"
              [tour]="concertForm.controls.tour.value"
              showClear
              fluid
            />
            <label for="tourLegId">Tour Leg</label>
          </p-floatlabel>
        </div>

        <div class="col-12">
          <p-floatlabel variant="on">
            <input pInputText id="customTitle" formControlName="customTitle" autocomplete="off" fluid [invalid]="concertForm.controls.customTitle.invalid" />
            <label for="customTitle">Custom Title</label>
          </p-floatlabel>
        </div>
      </div>
    </p-card>

    <p-card class="mt-3">
      <ng-template #subtitle>
        Timing information
      </ng-template>

      <div class="grid">
        <!-- Posted start time -->
        <div class="col-12">
          <div class="flex flex-wrap gap-3">
            <div>
              <p-floatlabel variant="on">
                <p-date-picker formControlName="postedStartTime" inputId="postedStartTime" showIcon iconDisplay="input" [showTime]="true" />
                <label for="postedStartTime">Start time</label>
              </p-floatlabel>
              <small>(according to ticket vendor)</small>
            </div>

            <div class="w-5 lg:w-3">
              <p-floatlabel variant="on">
                <p-select [options]="timezones" optionValue="tzCode" optionLabel="label" formControlName="timezone" id="timezone" fluid filter />
                <label for="timezone">Venue's timezone</label>
              </p-floatlabel>
            </div>

            <p-button class="hidden md:inline" label="Load timezone" icon="pi pi-sync" variant="outlined" disabled />
          </div>
        </div>

        <!-- Official Doors Time -->
        <div class="col-12 sm:col-12 md:col-6 xl:col-3">
          <p-floatlabel variant="on">
            <input pInputText id="doorsTime" formControlName="doorsTime" autocomplete="off" type="time" fluid />
            <label for="doorsTime">Doors time</label>
          </p-floatlabel>
        </div>

        <!-- LP stage Time -->
        <div class="col-12 sm:col-12 md:col-6 xl:col-3">
          <p-floatlabel variant="on">
            <input pInputText id="lpStageTime" formControlName="lpStageTime" autocomplete="off" type="time" fluid />
            <label for="lpStageTime">Confirmed Linkin Park stage time</label>
          </p-floatlabel>
        </div>

        <!-- Expected set duration -->
        <div class="col-12 sm:col-12 md:col-6 xl:col-3">
          <p-floatlabel variant="on">
            <p-date-picker formControlName="expectedSetDuration" inputId="expectedSetDuration" showIcon [showButtonBar]="true" iconDisplay="input" [timeOnly]="true" fluid>
              <ng-template #buttonbar let-todayCallback="todayCallback" let-clearCallback="clearCallback">
                <div class="flex justify-between w-full">
                  <div class="flex gap-2">
                    <p-button size="small" label="2h" severity="primary" variant="outlined" (onClick)="setExpectedSetDuration(120)" />
                    <p-button size="small" label="90 min" severity="secondary" variant="outlined" (onClick)="setExpectedSetDuration(90)" />
                    <p-button size="small" label="1h" severity="secondary" variant="outlined" (onClick)="setExpectedSetDuration(60)" />
                  </div>
                  <div class="flex gap-2">
                    <p-button size="small" icon="pi pi-times" severity="danger" variant="text" (click)="clearCallback($event)" />
                  </div>
                </div>
              </ng-template>
            </p-date-picker>
            <label for="expectedSetDuration">Expected set duration</label>
          </p-floatlabel>
        </div>
      </div>
    </p-card>
  </ng-template>

  @if (standalone$) {
    <p-card class="mt-3">
      <ng-container *ngTemplateOutlet="formInputsGeneral" />

      <ng-template #footer>
        <p-divider />
        <div class="flex gap-4 mt-1 align-content-end justify-content-end">
          <p-button [label]="isSaving$ ? 'Saving...' : 'Save'" [loading]="isSaving$" (onClick)="onSaveClicked()" [disabled]="isSaving$ || !concertForm.valid" />
        </div>
      </ng-template>
    </p-card>
  } @else {
    <ng-container *ngTemplateOutlet="formInputsGeneral" />
  }
</form>
