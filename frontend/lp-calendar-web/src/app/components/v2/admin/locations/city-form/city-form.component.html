<form #form="ngForm" [formGroup]="cityForm" class="form">
  <ng-template #formInputsGeneral>
    <div class="grid gap-2">
      <div class="col-12">
        <p-floatlabel variant="on">
          <p-select formControlName="countryCode" inputId="countryCode" [options]="availableCountries$" optionLabel="name" optionValue="isoCode" aria-autocomplete="none" showClear fluid />
          <label for="countryCode">Country</label>
        </p-floatlabel>
      </div>

      <div class="col-12">
        <p-floatlabel variant="on">
          <input pInputText id="name" formControlName="name" autocomplete="off" fluid [invalid]="cityForm.controls.name.invalid" />
          <label for="name">Name (English)</label>
        </p-floatlabel>
      </div>

      <div class="col-12">
        <p-floatlabel variant="on">
          <input pInputText id="nativeName" formControlName="nativeName" autocomplete="off" fluid [invalid]="cityForm.controls.nativeName.invalid" />
          <label for="nativeName">Name (in the country's language)</label>
        </p-floatlabel>
      </div>
    </div>
  </ng-template>

  @if (standalone$) {
    <p-card class="mt-3">
      <ng-container *ngTemplateOutlet="formInputsGeneral" />

      <ng-template #footer>
        <p-divider />
        <div class="flex gap-4 mt-1 align-content-end justify-content-end">
          <p-button [label]="isSaving$ ? 'Saving...' : 'Save'" [loading]="isSaving$" (onClick)="onSaveClicked()" [disabled]="isSaving$ || !cityForm.valid" />
        </div>
      </ng-template>
    </p-card>
  } @else {
    <ng-container *ngTemplateOutlet="formInputsGeneral" />
  }

</form>
