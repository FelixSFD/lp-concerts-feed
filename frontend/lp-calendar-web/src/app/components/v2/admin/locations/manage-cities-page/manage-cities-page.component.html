<p-confirm-dialog />

<p-card>
  <ng-template #title>
    Manage cities
  </ng-template>

  <p-table
    #dt2
    [value]="cities$"
    dataKey="id"
    stripedRows
    rowHover
    [rows]="25"
    [rowsPerPageOptions]="[10, 25, 50, 100, 200]"
    [loading]="isLoading$"
    [paginator]="true"
    [globalFilterFields]="['name', 'nativeName', 'countryCode', 'country.name', 'country.nativeName']"
    [tableStyle]="{ 'min-width': '75rem' }"
  >
    <ng-template #caption>
      <div class="flex">
        <p-button variant="outlined" label="Add city" [routerLink]="['add']" />

        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input pInputText type="text" [(ngModel)]="globalSearchText$" (input)="dt2.filterGlobal(globalSearchText$, 'contains')" placeholder="Search keyword" />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th scope="col">Name (English)</th>
        <th scope="col">Name</th>
        <th scope="col">Country</th>
        <th scope="col"></th>
      </tr>
      <tr>
        <th>
          <p-column-filter type="text" field="name" placeholder="Name" ariaLabel="Filter City Names" filterOn="input"></p-column-filter>
        </th>
        <th>
          <p-column-filter type="text" field="nativeName" placeholder="Name" ariaLabel="Filter City Names" filterOn="input"></p-column-filter>
        </th>
        <th>
          <p-column-filter type="text" field="country.name" placeholder="Name" ariaLabel="Filter Country Names" filterOn="input"></p-column-filter>
        </th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-city>
      <tr>
        <td>
          {{ city.name }}
        </td>
        <td>
          {{ city.nativeName }}
        </td>
        <td>
          {{ city.country.name }}
          <div class="text-500 font-italic">
            {{ city.country.nativeName }}
          </div>
        </td>
        <td>
          <p-button-group>
            <p-button label="Edit" icon="pi pi-pencil" variant="outlined" size="small" [routerLink]="['..', 'countries', city.countryCode, 'cities', city.id]" [disabled]="isDeletingCity$" />
            <p-button label="Delete" icon="pi pi-trash" variant="outlined" size="small" severity="danger" (click)="onDeleteCityClicked($event, city)" [disabled]="isDeletingCity$" />
          </p-button-group>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">No cities found.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
