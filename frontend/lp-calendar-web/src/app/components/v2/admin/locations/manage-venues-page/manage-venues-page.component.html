<p-confirmDialog />

<p-card>
  <ng-template #title>
    Manage venues
  </ng-template>

  <p-table
    #dt2
    [value]="venues$"
    dataKey="id"
    stripedRows
    rowHover
    [rows]="25"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    [loading]="isLoading$"
    [paginator]="true"
    [globalFilterFields]="['currentName', 'countryCode']"
    [tableStyle]="{ 'min-width': '75rem' }"
  >
    <ng-template #caption>
      <div class="flex">
        <p-button variant="outlined" label="Add venue" [routerLink]="['add']" />

        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input pInputText type="text" [(ngModel)]="globalSearchText$" (input)="dt2.filterGlobal(globalSearchText$, 'contains')" placeholder="Search keyword" />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th scope="col">Current Name</th>
        <th scope="col">Country</th>
        <th scope="col"></th>
      </tr>
      <tr>
        <th>
          <p-column-filter type="text" field="currentName" placeholder="Name" ariaLabel="Filter Venue Names" filterOn="input"></p-column-filter>
        </th>
        <th>
          <p-column-filter type="text" field="countryCode" placeholder="Country Code" ariaLabel="Filter ISO Codes" filterOn="input"></p-column-filter>
        </th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-venue>
      <tr>
        <td>
          {{ venue.name }}
        </td>
        <td>
          {{ venue.countryCode }}
        </td>
        <td>
          <p-button-group>
            <p-button label="Edit" icon="pi pi-pencil" variant="outlined" size="small" [routerLink]="[venue.countryCode]" [disabled]="isDeletingVenue$" />
            <p-button label="Delete" icon="pi pi-trash" variant="outlined" size="small" severity="danger" (click)="onDeleteVenueClicked($event, venue)" [disabled]="isDeletingVenue$" />
          </p-button-group>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">No venues found.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
