<p-card>
  <ng-template #title>
    Edit country
  </ng-template>

  <p-button severity="secondary" variant="outlined" icon="pi pi-arrow-left" label="Country list" [routerLink]="['../']" />

  <app-country-form (saveClicked)="onSaveClicked($event)" [is-saving]="isSaving$" />

  <p-card class="mt-4">
    <ng-template #title>
      States, Provinces, etc.
    </ng-template>

    <p-table
      #dt2
      [value]="statesInCountry$"
      dataKey="id"
      stripedRows
      rowHover
      [rows]="25"
      [rowsPerPageOptions]="[10, 25, 50]"
      [loading]="isLoadingStates$"
      [paginator]="true"
      [tableStyle]="{ 'min-width': '75rem' }"
    >
      <ng-template #caption>
        <div class="flex">
          <p-button variant="outlined" label="Add state" [routerLink]="['add']" disabled />
        </div>
      </ng-template>
      <ng-template #header>
        <tr>
          <th scope="col">Name (English)</th>
          <th scope="col">Name</th>
          <th scope="col">Abbreviation</th>
          <th scope="col"></th>
        </tr>
      </ng-template>
      <ng-template #body let-state>
        <tr>
          <td>
            {{ state.name }}
          </td>
          <td>
            {{ state.nativeName }}
          </td>
          <td>
            {{ state.code }}
          </td>
          <td>
            <!--<p-button-group>
              <p-button label="Edit" icon="pi pi-pencil" variant="outlined" size="small" [routerLink]="[country.isoCode]" [disabled]="isDeletingCountry$" />
              <p-button label="Delete" icon="pi pi-trash" variant="outlined" size="small" severity="danger" (click)="onDeleteCountryClicked($event, country)" [disabled]="isDeletingCountry$" />
            </p-button-group>-->
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">No states or provinces found.</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</p-card>
