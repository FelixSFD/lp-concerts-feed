<p-confirmDialog />

<p-card>
  <ng-template #title>
    Manage countries
  </ng-template>

  <p-table
    #dt2
    [value]="countries$"
    dataKey="id"
    stripedRows
    rowHover
    [rows]="25"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    [loading]="isLoading$"
    [paginator]="true"
    [globalFilterFields]="['name', 'nativeName', 'isoCode']"
    [tableStyle]="{ 'min-width': '75rem' }"
  >
    <ng-template #caption>
      <div class="flex">
        <p-button variant="outlined" label="Add country" [routerLink]="['add']" />

        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input pInputText type="text" [(ngModel)]="globalSearchText$" (input)="dt2.filterGlobal(globalSearchText$, 'contains')" placeholder="Search keyword" />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th scope="col">Name (English)</th>
        <th scope="col">Name</th>
        <th scope="col">ISO Code</th>
        <th scope="col"></th>
      </tr>
      <tr>
        <th>
          <p-column-filter type="text" field="name" placeholder="Name" ariaLabel="Filter Country Names" filterOn="input"></p-column-filter>
        </th>
        <th>
          <p-column-filter type="text" field="nativeName" placeholder="Name" ariaLabel="Filter Country Names" filterOn="input"></p-column-filter>
        </th>
        <th>
          <p-column-filter type="text" field="isoCode" placeholder="ISO Code" ariaLabel="Filter ISO Codes" filterOn="input"></p-column-filter>
        </th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-country>
      <tr>
        <td>
          {{ country.name }}
        </td>
        <td>
          {{ country.nativeName }}
        </td>
        <td>
          {{ country.isoCode }}
        </td>
        <td>
          <p-button-group>
            <p-button label="Edit" icon="pi pi-pencil" variant="outlined" size="small" [routerLink]="[country.isoCode]" [disabled]="isDeletingCountry$" />
            <p-button label="Delete" icon="pi pi-trash" variant="outlined" size="small" severity="danger" (click)="onDeleteCountryClicked($event, country)" [disabled]="isDeletingCountry$" />
          </p-button-group>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">No countries found.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
