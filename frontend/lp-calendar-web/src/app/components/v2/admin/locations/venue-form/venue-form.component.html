<!-- add/edit historic venue name modal -->
<p-dialog
  [header]="isEditingHistoricName$() ? 'Edit historic name' : 'Add historic name'"
  [visible]="isShowingHistoricNameDialog$()"
  (visibleChange)="isShowingHistoricNameDialog$.set($event)"
  [modal]="true"
  [breakpoints]="{ '1199px': '50vw', '575px': '90vw' }"
  [style]="{ width: '30rem' }"
  [draggable]="false"
  [dismissableMask]="true"
  [resizable]="true"
>
  <form [formGroup]="historicNameForm" class="flex flex-column gap-3 mt-2">
    <div>
      <p-floatlabel variant="on">
        <input
          pInputText
          id="historicVenueName"
          formControlName="name"
          autocomplete="off"
          fluid
          [invalid]="historicNameForm.controls.name.invalid && historicNameForm.controls.name.touched"
        />
        <label for="historicVenueName">Name</label>
      </p-floatlabel>
    </div>

    <div>
      <p-floatlabel variant="on">
        <p-date-picker
          formControlName="usedFrom"
          inputId="usedFrom"
          dateFormat="yy-mm-dd"
          [showIcon]="true"
          [showButtonBar]="true"
          fluid
          [invalid]="historicNameForm.controls.usedFrom.invalid && historicNameForm.controls.usedFrom.touched"
        />
        <label for="usedFrom">Valid from</label>
      </p-floatlabel>
    </div>

    <div>
      <p-floatlabel variant="on">
        <p-date-picker
          formControlName="usedUntil"
          inputId="usedUntil"
          dateFormat="yy-mm-dd"
          [showIcon]="true"
          [showButtonBar]="true"
          fluid
        />
        <label for="usedUntil">Valid until (optional)</label>
      </p-floatlabel>
    </div>
  </form>

  <ng-template #footer>
    <div class="flex justify-content-end gap-2">
      <p-button label="Cancel" severity="secondary" variant="text" (onClick)="isShowingHistoricNameDialog$.set(false)" />
      <p-button [label]="isEditingHistoricName$() ? 'Save' : 'Add'" icon="pi pi-check" (onClick)="onSaveHistoricNameDialog()" [disabled]="!historicNameForm.valid" />
    </div>
  </ng-template>
</p-dialog>

<form #form="ngForm" [formGroup]="venueForm" class="form mt-2">
  <ng-template #formInputsGeneral>
    <div class="grid gap-2">
      <div class="col-12">
        <p-floatlabel variant="on">
          <p-select formControlName="countryCode" inputId="countryCode" [options]="countries$" optionLabel="name" optionValue="isoCode" aria-autocomplete="none" showClear fluid />
          <label for="countryCode">Country</label>
        </p-floatlabel>
      </div>

      <div class="col-12">
        <p-floatlabel variant="on">
          <p-select formControlName="cityId" inputId="cityId" [options]="citiesInCountry$()" optionLabel="name" optionValue="id" aria-autocomplete="none" showClear fluid />
          <label for="cityId">City</label>
        </p-floatlabel>
      </div>

      <div class="col-12">
        <div class="flex gap-2">
          <p-floatlabel variant="on">
            <app-select-timezone
              formControlName="timezone"
              inputId="timezone"
              [invalid]="venueForm.controls.timezone.invalid"
              fluid
              filter
            />
            <label for="timezone">Venue's timezone</label>
          </p-floatlabel>
          <p-button class="md:hidden" icon="pi pi-sync" variant="outlined" (onClick)="onUpdateTimeZoneClicked()" [disabled]="timeZoneIsLoading$()" [loading]="timeZoneIsLoading$()" />
          <p-button class="hidden md:inline" label="Load timezone" icon="pi pi-sync" variant="outlined" (onClick)="onUpdateTimeZoneClicked()" [disabled]="timeZoneIsLoading$()" [loading]="timeZoneIsLoading$()" />
        </div>
      </div>

      <div class="col-12">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="currentName"
            formControlName="currentName"
            autocomplete="off"
            fluid
            [invalid]="venueForm.controls.currentName.invalid"
          />
          <label for="currentName">Current Name</label>
        </p-floatlabel>
      </div>

      <p-divider />

      <!-- Historic names section -->
      <div class="col-12">
        <div class="flex justify-content-between align-items-center mb-2">
          <span class="font-bold text-lg">Historic Names</span>
          <p-button label="Add historic name" icon="pi pi-plus" size="small" variant="outlined" (onClick)="onAddHistoricNameClicked()" />
        </div>
        <p-table [value]="historicNames$()" [tableStyle]="{ 'min-width': '30rem' }" stripedRows>
          <ng-template #header>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Valid From</th>
              <th scope="col">Valid Until</th>
              <th scope="col" style="width: 8rem"></th>
            </tr>
          </ng-template>
          <ng-template #body let-historicName let-i="rowIndex">
            <tr>
              <td>{{ historicName.name }}</td>
              <td>{{ historicName.usedFrom }}</td>
              <td>{{ historicName.usedUntil || '-' }}</td>
              <td>
                <p-button-group size="small">
                  <p-button size="small" icon="pi pi-pencil" variant="outlined" severity="secondary" (onClick)="onEditHistoricNameClicked(historicName, i)" />
                  <p-button size="small" icon="pi pi-trash" variant="outlined" severity="danger" (onClick)="onDeleteHistoricNameClicked(i)" />
                </p-button-group>
              </td>
            </tr>
          </ng-template>
          <ng-template #emptymessage>
            <tr>
              <td colspan="4" class="text-center text-muted">No historic names recorded for this venue.</td>
            </tr>
          </ng-template>
        </p-table>
      </div>

      <p-divider />

      <!-- Map with the location of the venue -->
      <!-- Coordinates -->
      <div class="col-12">
        <div class="flex gap-2">
          <p-floatlabel variant="on">
            <p-input-number formControlName="latitude" inputId="venueLat" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="9" fluid />
            <label for="venueLat">Venue latitude</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <p-input-number formControlName="longitude" inputId="venueLong" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="9" fluid />
            <label for="venueLong">Venue longitude</label>
          </p-floatlabel>
        </div>
      </div>

      <div class="col-12">
        <div class="flex flex-wrap gap-2">
          <p-button label="Try to set pin at venue" icon="pi pi-bullseye" (onClick)="tryAutoSetVenuePin()" severity="secondary" variant="outlined" />
          <p-button label="Go to city" icon="pi pi-map" (onClick)="onGoToCityClicked()" severity="secondary" variant="outlined" />
          <p-button label="Set pin here" icon="pi pi-map-marker" (onClick)="onSetPinClicked()" severity="secondary" variant="outlined" />
        </div>
      </div>

      <!-- Apple Maps -->
      <div class="col-12">
        <div #appleMaps class="venue-map"></div>
      </div>
    </div>
  </ng-template>

  @if (standalone$) {
    <p-card class="mt-3">
      <ng-container *ngTemplateOutlet="formInputsGeneral" />

      <ng-template #footer>
        <p-divider />
        <div class="flex gap-4 mt-1 align-content-end justify-content-end">
          <p-button
            [label]="isSaving$ ? 'Saving...' : 'Save'"
            [loading]="isSaving$"
            (onClick)="onSaveClicked()"
            [disabled]="isSaving$ || !venueForm.valid"
          />
        </div>
      </ng-template>
    </p-card>
  } @else {
    <ng-container *ngTemplateOutlet="formInputsGeneral" />
  }
</form>
