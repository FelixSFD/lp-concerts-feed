<form #form="ngForm" [formGroup]="venueForm" class="form mt-2">
  <ng-template #formInputsGeneral>
    <div class="grid gap-2">
      <div class="col-12">
        <p-floatlabel variant="on">
          <p-select formControlName="countryCode" inputId="countryCode" [options]="countries$" optionLabel="name" optionValue="isoCode" aria-autocomplete="none" showClear fluid />
          <label for="countryCode">Country</label>
        </p-floatlabel>
      </div>

      <div class="col-12">
        <p-floatlabel variant="on">
          <p-select formControlName="cityId" inputId="cityId" [options]="citiesInCountry$" optionLabel="name" optionValue="id" aria-autocomplete="none" showClear fluid />
          <label for="cityId">City</label>
        </p-floatlabel>
      </div>

      <div class="col-12">
        <p-inputgroup>
          <p-floatlabel variant="on">
            <p-select [options]="timezones" optionValue="tzCode" optionLabel="label" formControlName="timezone" id="timezone" fluid filter />
            <label for="timezone">Venue's timezone</label>
          </p-floatlabel>
          <p-inputgroup-addon class="w-full">
            <p-button class="md:hidden" icon="pi pi-sync" variant="outlined" (onClick)="onUpdateTimeZoneClicked()" [disabled]="timeZoneIsLoading$" [loading]="timeZoneIsLoading$" />
            <p-button class="hidden md:inline" label="Load timezone" icon="pi pi-sync" variant="outlined" (onClick)="onUpdateTimeZoneClicked()" [disabled]="timeZoneIsLoading$" [loading]="timeZoneIsLoading$" />
          </p-inputgroup-addon>
        </p-inputgroup>
      </div>

      <div class="col-12">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="currentName"
            formControlName="currentName"
            autocomplete="off"
            fluid
            [invalid]="venueForm.controls.currentName.invalid"
          />
          <label for="name">Current Name</label>
        </p-floatlabel>
      </div>

      <p-divider />

      <!-- Map with the location of the venue -->
      <!-- Coordinates -->
      <div class="col-12">
        <div class="flex gap-2">
          <p-floatlabel variant="on">
            <p-input-number formControlName="latitude" inputId="venueLat" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="9" fluid />
            <label for="venueLat">Venue latitude</label>
          </p-floatlabel>

          <p-floatlabel variant="on">
            <p-input-number formControlName="longitude" inputId="venueLong" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="9" fluid />
            <label for="venueLong">Venue longitude</label>
          </p-floatlabel>
        </div>
      </div>

      <div class="col-12">
        <div class="flex flex-wrap gap-2">
          <p-button label="Try to set pin at venue" icon="pi pi-bullseye" (onClick)="tryAutoSetVenuePin()" severity="secondary" variant="outlined" />
          <p-button label="Go to city" icon="pi pi-map" (onClick)="onGoToCityClicked()" severity="secondary" variant="outlined" />
          <p-button label="Set pin here" icon="pi pi-map-marker" (onClick)="onSetPinClicked()" severity="secondary" variant="outlined" />
        </div>
      </div>

      <!-- Apple Maps -->
      <div class="col-12">
        <div #appleMaps class="venue-map"></div>
      </div>
    </div>
  </ng-template>

  @if (standalone$) {
    <p-card class="mt-3">
      <ng-container *ngTemplateOutlet="formInputsGeneral" />

      <ng-template #footer>
        <p-divider />
        <div class="flex gap-4 mt-1 align-content-end justify-content-end">
          <p-button
            [label]="isSaving$ ? 'Saving...' : 'Save'"
            [loading]="isSaving$"
            (onClick)="onSaveClicked()"
            [disabled]="isSaving$ || !venueForm.valid"
          />
        </div>
      </ng-template>
    </p-card>
  } @else {
    <ng-container *ngTemplateOutlet="formInputsGeneral" />
  }
</form>
