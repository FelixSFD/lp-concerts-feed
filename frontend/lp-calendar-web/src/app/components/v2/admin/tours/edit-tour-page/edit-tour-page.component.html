<p-confirmdialog />

<div class="flex justify-content-center">
  <div class="col-12 lg:col-8">
    <p-card>
      <ng-template #title>
        <div class="flex flex-row justify-content-between align-items-center">
          <span>{{ currentTourName ? 'Edit ' + currentTourName : 'Edit tour' }}</span>
        </div>
      </ng-template>

      <p-button
        severity="secondary"
        variant="outlined"
        icon="pi pi-arrow-left"
        label="Tour list"
        [routerLink]="['../']"
      />

      <app-tour-form
        [is-saving]="isSaving$"
        [is-edit]="true"
        [standalone]="true"
      />
    </p-card>

    <p-card class="mt-4">
      <ng-template #title>
        <div class="flex flex-row justify-content-between align-items-center">
          <span>Tour legs</span>
        </div>
      </ng-template>

      <p-button
        label="Add tour leg"
        icon="pi pi-plus"
        size="small"
        (onClick)="onOpenAddLegDialog()"
      />

      <p-table
        #dtLegs
        [value]="legsInTour$"
        stripedRows
        rowHover
        dataKey="id"
      >
        <ng-template #header>
          <tr>
            <th>Name</th>
            <th>ID</th>
            <th style="width: 5rem"></th>
          </tr>
        </ng-template>

        <ng-template #body let-leg>
          <tr>
            <td>{{ leg.name }}</td>
            <td><code>{{ leg.id }}</code></td>
            <td class="text-right">
              <p-button
                (click)="onDeleteLegClicked($event, leg)"
                severity="danger"
                icon="pi pi-trash"
                variant="outlined"
              />
            </td>
          </tr>
        </ng-template>

        <ng-template #emptymessage>
          <tr>
            <td colspan="3" class="text-center text-secondary">
              No legs found for this tour.
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>
  </div>
</div>

<p-dialog
  header="Add a new tour leg"
  [(visible)]="isShowingAddLegDialog$"
  [modal]="true"
  [style]="{ width: '500px' }"
>
  <app-tour-leg-form
    (saveClicked)="onSaveLegClicked($event)"
    [standalone]="false"
    [is-saving]="isAddingLeg$"
  />

  <ng-template #footer>
    <div class="flex justify-content-end gap-2">
      <p-button
        label="Cancel"
        severity="secondary"
        variant="text"
        (onClick)="isShowingAddLegDialog$ = false"
      />
      <p-button
        label="Add leg"
        icon="pi pi-check"
        [loading]="isAddingLeg$"
        (onClick)="tourLegFormComponent()?.onSaveClicked()"
      />
    </div>
  </ng-template>
</p-dialog>
