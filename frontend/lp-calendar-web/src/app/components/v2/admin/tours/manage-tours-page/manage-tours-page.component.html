<p-confirm-dialog />

<p-card>
  <ng-template #title>
    Manage tours
  </ng-template>

  <p-table
    #dtTours
    [value]="tours$()"
    dataKey="id"
    stripedRows
    rowHover
    [rows]="25"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    [loading]="isLoading$()"
    [paginator]="true"
    [globalFilterFields]="['name', 'id']"
    [tableStyle]="{ 'min-width': '50rem' }"
  >
    <ng-template #caption>
      <div class="flex">
        <p-button variant="outlined" label="Add tour" [routerLink]="['add']" />

        <p-iconfield iconPosition="left" class="ml-auto">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            pInputText
            type="text"
            [(ngModel)]="globalSearchText$"
            (input)="dtTours.filterGlobal(globalSearchText$, 'contains')"
            placeholder="Search keyword"
          />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">ID</th>
        <th scope="col">Legs</th>
        <th scope="col"></th>
      </tr>
      <tr>
        <th>
          <p-column-filter type="text" field="name" placeholder="Name" ariaLabel="Filter Tour Names" filterOn="input" />
        </th>
        <th>
          <p-column-filter type="text" field="id" placeholder="ID" ariaLabel="Filter Tour IDs" filterOn="input" />
        </th>
        <th></th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-tour>
      <tr>
        <td>{{ tour.name }}</td>
        <td><code>{{ tour.id }}</code></td>
        <td>{{ tour.legs?.length ?? 0 }}</td>
        <td>
          <p-button-group>
            <p-button
              label="Edit"
              icon="pi pi-pencil"
              variant="outlined"
              size="small"
              [routerLink]="[tour.id]"
              [disabled]="isDeletingTour$()"
            />
            <p-button
              label="Delete"
              icon="pi pi-trash"
              variant="outlined"
              size="small"
              severity="danger"
              (click)="onDeleteTourClicked($event, tour)"
              [disabled]="isDeletingTour$()"
            />
          </p-button-group>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="text-center text-secondary">
          @if (isLoading$()) {
            Loading tours...
          } @else {
            No tours found.
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
