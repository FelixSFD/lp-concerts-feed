<form #form="ngForm" [formGroup]="legForm" class="form">
  <ng-template #formInputsGeneral>
    <div class="grid gap-2">
      <div class="col-12">
        <p-floatlabel variant="on">
          <input pInputText id="legId" formControlName="id" autocomplete="off" fluid [invalid]="legForm.controls.id.invalid" />
          <label for="legId">Leg ID</label>
        </p-floatlabel>
      </div>

      <div class="col-12">
        <p-floatlabel variant="on">
          <input pInputText id="legName" formControlName="name" autocomplete="off" fluid [invalid]="legForm.controls.name.invalid" />
          <label for="legName">Leg Name</label>
        </p-floatlabel>
      </div>
    </div>
  </ng-template>

  @if (standalone$) {
    <p-card class="mt-3">
      <ng-container *ngTemplateOutlet="formInputsGeneral" />

      <ng-template #footer>
        <p-divider />
        <div class="flex gap-4 mt-1 align-content-end justify-content-end">
          <p-button [label]="isSaving$ ? 'Saving...' : 'Save'" [loading]="isSaving$" (onClick)="onSaveClicked()" [disabled]="isSaving$ || !legForm.valid" />
        </div>
      </ng-template>
    </p-card>
  } @else {
    <ng-container *ngTemplateOutlet="formInputsGeneral" />
  }
</form>
