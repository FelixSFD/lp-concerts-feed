<p-card>
  <ng-template #title>
    Map of all concerts
  </ng-template>
  <p>
    On this page you can have a look at the map of all concerts since 2024, sorted by tour.
  </p>

  <app-select-tour [(ngModel)]="this.currentFilter.tour" placeholder="Select a tour" (ngModelChange)="onTourSelected($event)" class="w-full" [showClear]="true" />

  <p-progress-bar
    class="mt-1 h-1rem"
    [value]="downloadStatus() * 100"
    [class.download-progress-hidden]="downloadStatus() >= 1"
    [class.download-progress-visible]="downloadStatus() < 1"
  />

  <p-divider />

  <div #map class="map"></div>

</p-card>
