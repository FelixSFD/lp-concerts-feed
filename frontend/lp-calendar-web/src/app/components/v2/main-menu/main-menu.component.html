<div class="card">
  <p-menubar [model]="mainMenuItems">
    <ng-template #start>
      <a href="/" class="mr-2">
        <img ngSrc="logo.webp" alt="Logo" width="30" height="30" class="mr-" />
      </a>
      <a class="text-color no-underline" href="/">
        <span style="font-weight: bold">
          L
          <span style="display: inline-block; transform: scaleX(-1); margin-left: -3px">
            P
          </span>
          Concert Calendar
        </span>
      </a>
    </ng-template>

    <ng-template #end>
      <span class="header-clock hidden md:inline">
        {{ currentDateTime$.toLocaleString(DateTime.TIME_SIMPLE) }}
      </span>

      @if (isLoggedIn$) {
        <p-menu #menu [model]="loggedInMenuItems" [popup]="true" />
        <button class="account-btn" type="button" aria-label="Account" (click)="menu.toggle($event)">
          @if (userInitial) { {{ userInitial }} } @else { <i class="pi pi-user"></i> }
        </button>
      } @else {
        <p-button variant="text" (click)="login()">Log in</p-button>
        <p-button class="getapp-desktop" label="Get the app" [routerLink]="['/app']" />
      }
    </ng-template>
  </p-menubar>
</div>
