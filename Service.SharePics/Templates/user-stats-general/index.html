<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Stats</title>

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css"
    />
    
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="pico-background-zinc-50">
    <!-- TODO: proper layout -->
    <article id="main-card" class="pico-background-purple-600">
        <div class="grid">
            <p class="pico-color-zinc-100">{{ username }}'s Linkin Park journey</p>
        </div>
        
        <div class="grid">
            <div class="stat-segment">
                <div class="stat-segment-value">{{ concerts }}</div>
                <div class="stat-segment-label">concerts</div>
            </div>

            <div class="stat-segment">
                <div class="stat-segment-value">{{ cities }}</div>
                <div class="stat-segment-label">cities</div>
            </div>

            <div class="stat-segment">
                <div class="stat-segment-value">{{ countries }}</div>
                <div class="stat-segment-label">countries</div>
            </div>

            <div class="stat-segment">
                <div class="stat-segment-value">{{ songs }}</div>
                <div class="stat-segment-label">different songs</div>
            </div>
        </div>
        
        <footer data-theme="dark">
            Generate your own summary on lpshows.live
        </footer>
    </article>
</main>
</body>
</html>
